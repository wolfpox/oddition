<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oddition</title>
<meta name="description" content="Procedural MIDI composer: audition generated stems, keep the ones you like, and build songs from them.">
<meta name="color-scheme" content="dark light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet" href="css/style.css">

<body>
<!--app:start-->
<div id="home" aria-label="Oddition home"></div>
<div id="bones" aria-label="Bones to Gold"></div>
<div id="songb" aria-label="Song Builder"></div>
<header class="topbar" id="topbar"></header>
<main class="desk" id="desk">
  <section class="panel song" id="song" aria-label="Song"></section>
  <section class="panel booth" id="booth" aria-label="Audition booth"></section>
  <section class="panel shelf" id="shelf" aria-label="Shelf"></section>
</main>
<nav class="tabs" id="tabs" aria-label="Views"></nav>
<div id="overlay" hidden></div>
<div id="toasts" aria-live="polite"></div>
<noscript><p style="padding:16px">Oddition needs JavaScript to run.</p></noscript>
<!--app:end-->
