<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oddition</title>
<meta name="color-scheme" content="dark light">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@50..150,100..900&family=Instrument+Sans:wght@400..700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Oddition
 * Layout: a recording console. A transport strip on top; the audition booth and
 * the shelf side by side; the song sheet (lanes x sections) underneath. Phones get
 * one panel at a time with tabs at the bottom.
 * Dark first, with a light theme. One colour per stem, used everywhere. */

:root {
  --bg: #13151a;
  --panel: #1a1d23;
  --raised: #23272f;
  --screen: #0e1014;
  --line: #2f3440;
  --grid: rgba(236, 235, 230, 0.06);
  --roll-black: rgba(0, 0, 0, 0.22);
  --ink: #ecebe6;
  --muted: #9a9ead;
  --faint: #8d92a2;
  --tally: #ff5b4e;
  --keep: #4fcb84;
  --focus: #8db6ff;
  --on-keep: #08200f;
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.45);

  --r-drums: #f27b62;
  --r-perc: #a9d15a;
  --r-bass: #a395ff;
  --r-chords: #4ec8b2;
  --r-pad: #6fb0ff;
  --r-lead: #f1cd58;
  --r-arp: #ef84c7;

  --font-display: 'Anybody', 'Arial Narrow', 'Helvetica Neue', system-ui, sans-serif;
  --font-body: 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;

  --fs-xs: 0.72rem;
  --fs-sm: 0.8rem;
  --fs-md: 0.9rem;
  --fs-lg: 1.05rem;
  --fs-xl: 1.35rem;
  --fs-take: clamp(1.6rem, 1.1rem + 1.8vw, 2.35rem);

  --radius: 10px;
  --radius-sm: 7px;
  --gutter: 16px;
  color-scheme: dark;
}

@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #e9ebef;
    --panel: #f7f8fa;
    --raised: #ffffff;
    --screen: #eef0f4;
    --line: #d0d4dc;
    --grid: rgba(26, 28, 34, 0.06);
    --roll-black: rgba(26, 28, 34, 0.05);
    --ink: #1a1c22;
    --muted: #596070;
    --faint: #6a7080;
    --tally: #d93a2e;
    --keep: #1c9655;
    --focus: #2f66d6;
    --on-keep: #ffffff;
    --shadow: 0 10px 30px rgba(20, 24, 34, 0.16);
    --r-drums: #cf5135;
    --r-perc: #5f8a1a;
    --r-bass: #6a55e0;
    --r-chords: #0f8d78;
    --r-pad: #2b78cf;
    --r-lead: #a77f00;
    --r-arp: #c2448f;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #e9ebef;
  --panel: #f7f8fa;
  --raised: #ffffff;
  --screen: #eef0f4;
  --line: #d0d4dc;
  --grid: rgba(26, 28, 34, 0.06);
  --roll-black: rgba(26, 28, 34, 0.05);
  --ink: #1a1c22;
  --muted: #596070;
  --faint: #6a7080;
  --tally: #d93a2e;
  --keep: #1c9655;
  --focus: #2f66d6;
  --on-keep: #ffffff;
  --shadow: 0 10px 30px rgba(20, 24, 34, 0.16);
  --r-drums: #cf5135;
  --r-perc: #5f8a1a;
  --r-bass: #6a55e0;
  --r-chords: #0f8d78;
  --r-pad: #2b78cf;
  --r-lead: #a77f00;
  --r-arp: #c2448f;
  color-scheme: light;
}

[data-role="drums"] { --role: var(--r-drums); }
[data-role="perc"] { --role: var(--r-perc); }
[data-role="bass"] { --role: var(--r-bass); }
[data-role="chords"] { --role: var(--r-chords); }
[data-role="pad"] { --role: var(--r-pad); }
[data-role="lead"] { --role: var(--r-lead); }
[data-role="arp"] { --role: var(--r-arp); }

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.45;
  min-height: 100vh;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  background: var(--panel);
  z-index: 30;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; opacity: 0.4; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; letter-spacing: 0; }
kbd {
  font-family: var(--font-mono);
  font-size: 0.68rem;
  padding: 1px 5px;
  border: 1px solid var(--line);
  border-bottom-width: 2px;
  border-radius: 4px;
  color: var(--muted);
  background: transparent;
  line-height: 1.3;
}

.ico { width: 20px; height: 20px; flex: none; }
.ico-sm { width: 16px; height: 16px; }
.ico-xs { width: 13px; height: 13px; }
.ico-title { width: 18px; height: 18px; color: var(--muted); }

/* ---------------- buttons ---------------- */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 34px;
  padding: 0 12px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--line);
  background: var(--raised);
  white-space: nowrap;
}
.btn:hover:not(:disabled) { border-color: var(--faint); }
.btn-sm { height: 30px; padding: 0 10px; font-size: var(--fs-sm); }
.btn-xs { height: 26px; padding: 0 8px; font-size: var(--fs-xs); gap: 4px; }
.btn-ghost { background: transparent; }
.btn-primary { background: var(--ink); color: var(--bg); border-color: var(--ink); font-weight: 600; }
.btn-primary:hover:not(:disabled) { border-color: var(--ink); opacity: 0.9; }
.btn-danger { background: var(--tally); border-color: var(--tally); color: #fff; }
.btn.is-on { background: color-mix(in srgb, var(--focus) 18%, var(--raised)); border-color: color-mix(in srgb, var(--focus) 55%, var(--line)); }
.btn kbd { margin-left: 2px; }

.icon-btn {
  display: inline-grid;
  place-items: center;
  width: 36px;
  height: 36px;
  border-radius: var(--radius-sm);
  border: 1px solid transparent;
  background: transparent;
  color: var(--muted);
  flex: none;
}
.icon-btn:hover:not(:disabled) { color: var(--ink); background: var(--raised); border-color: var(--line); }
.icon-btn.is-on { color: var(--ink); }
.icon-btn-sm { width: 30px; height: 30px; }
.icon-btn-sm .ico { width: 17px; height: 17px; }
.icon-btn-xs { width: 26px; height: 26px; }
.icon-btn-xs .ico { width: 15px; height: 15px; }
.star.is-on { color: var(--r-lead); }

.when-playing { display: none !important; }
.is-playing:not(body) .when-playing { display: inline-flex !important; }
.is-playing:not(body) .when-stopped { display: none !important; }
.icon-btn.is-playing { color: var(--tally); }

select, input[type="text"], input[type="search"], input[type="number"] {
  height: 34px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--line);
  background: var(--raised);
  padding: 0 10px;
  min-width: 0;
}
select { padding-right: 6px; }
input[type="range"] { accent-color: var(--ink); min-width: 0; }

.eyebrow {
  font-size: 0.64rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--faint);
  font-weight: 600;
}
.pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: var(--fs-xs);
  padding: 1px 8px;
  border-radius: 999px;
  border: 1px solid var(--line);
  color: var(--muted);
  white-space: nowrap;
}
.pill-keep { color: var(--keep); border-color: color-mix(in srgb, var(--keep) 45%, var(--line)); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--role); flex: none; }
.tag {
  font-family: var(--font-mono);
  font-size: 0.62rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  padding: 2px 6px;
  border-radius: 4px;
  color: var(--role);
  background: color-mix(in srgb, var(--role) 15%, transparent);
  flex: none;
}

/* ---------------- top bar ---------------- */
.topbar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 20;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
  padding-block: 8px;
  padding-left: max(var(--gutter), env(safe-area-inset-left, 0px));
  padding-right: max(var(--gutter), env(safe-area-inset-right, 0px));
}
.top-row { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand { flex: none; }
.wordmark {
  font-family: var(--font-display);
  font-stretch: 150%;
  font-weight: 800;
  font-size: 1.15rem;
  letter-spacing: 0.02em;
  text-transform: uppercase;
}
.session-btn {
  display: grid;
  grid-template-columns: auto auto;
  grid-template-rows: auto auto;
  column-gap: 6px;
  align-items: center;
  text-align: left;
  padding: 3px 10px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--line);
  background: transparent;
  min-width: 0;
  max-width: 260px;
}
.session-btn .eyebrow { grid-column: 1 / -1; line-height: 1.2; }
.session-btn .session-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.session-btn .ico { color: var(--muted); }
.session-btn:hover { border-color: var(--faint); }

.transport { display: flex; align-items: center; gap: 10px; margin-left: auto; min-width: 0; }
.play-main {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: var(--raised);
  display: grid;
  place-items: center;
  flex: none;
}
.play-main .ico { width: 20px; height: 20px; }
.play-main.is-playing { background: var(--tally); border-color: var(--tally); color: #fff; }
.onair {
  display: flex;
  align-items: center;
  gap: 8px;
  height: 30px;
  padding: 0 12px;
  border-radius: 6px;
  border: 1px solid var(--line);
  background: var(--screen);
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--faint);
  min-width: 0;
  max-width: 260px;
}
.onair-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lamp { width: 8px; height: 8px; border-radius: 50%; background: var(--line); flex: none; }
.onair.is-live { color: var(--ink); }
.onair.is-live .lamp { background: var(--tally); box-shadow: 0 0 10px var(--tally); animation: lamp 1.6s ease-in-out infinite; }
@keyframes lamp { 50% { opacity: 0.55; } }

.top-actions { display: flex; align-items: center; gap: 4px; flex: none; }
.export-btn { margin-left: 6px; }
.fields-toggle { display: none; }

.fields {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: 10px 14px;
  padding-top: 8px;
}
.fld { display: grid; gap: 2px; font-size: var(--fs-sm); }
.fld > span { font-size: 0.64rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint); font-weight: 600; display: flex; gap: 6px; }
.fld output { color: var(--muted); font-family: var(--font-mono); letter-spacing: 0; text-transform: none; }
.fld select, .fld input[type="number"] { height: 30px; }
.fld-num input { width: 76px; font-family: var(--font-mono); }
.fld-range input { width: 120px; height: 30px; }
.meter { width: 120px; height: 8px; border-radius: 2px; margin-left: auto; align-self: center; }
.more-btn { align-self: flex-end; height: 30px; }
.fields-more { display: none; flex-basis: 100%; flex-wrap: wrap; align-items: flex-end; gap: 10px 14px; padding-top: 4px; border-top: 1px dashed var(--line); }
.fields-more.open { display: flex; }
.arr-label { flex: none; align-self: center; margin-right: 4px; }
.chord-mode .mono { font-size: var(--fs-xs); }
.phone-only { display: none; }

/* ---------------- desk ---------------- */
.desk {
  display: grid;
  grid-template-columns: minmax(0, 1.3fr) minmax(320px, 1fr);
  grid-template-areas: "song song" "booth shelf";
  gap: 14px;
  padding-block: 14px 40px;
  padding-left: max(var(--gutter), env(safe-area-inset-left, 0px));
  padding-right: max(var(--gutter), env(safe-area-inset-right, 0px));
  max-width: 1680px;
  margin: 0 auto;
}
.panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.booth { grid-area: booth; }
.shelf { grid-area: shelf; height: 0; min-height: 100%; }
.song { grid-area: song; }
.panel-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-width: 0; }
.panel-title {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0;
  font-family: var(--font-display);
  font-stretch: 112%;
  font-weight: 700;
  font-size: var(--fs-lg);
  letter-spacing: 0.01em;
}
.panel-title .count { font-size: var(--fs-sm); color: var(--faint); font-weight: 500; }
.panel-tools { display: flex; gap: 6px; margin-left: auto; flex-wrap: wrap; }

/* ---------------- booth ---------------- */
.booth-target { display: flex; align-items: center; gap: 10px; margin-left: auto; min-width: 0; flex-wrap: wrap; }
.inline-fld { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-sm); color: var(--muted); }
.inline-fld select { height: 30px; }
.chord-line { font-size: var(--fs-sm); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }

.roles { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.roles::-webkit-scrollbar { display: none; }
.role-btn {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  height: 34px;
  padding: 0 12px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: transparent;
  color: var(--muted);
  white-space: nowrap;
  flex: none;
}
.role-btn kbd { font-size: 0.6rem; padding: 0 4px; opacity: 0.8; }
.role-btn:hover { color: var(--ink); border-color: var(--faint); }
.role-btn.is-active {
  color: var(--ink);
  border-color: var(--role);
  background: color-mix(in srgb, var(--role) 16%, transparent);
}

.take-area {
  display: grid;
  gap: 10px;
  border-radius: var(--radius);
  transition: box-shadow 0.25s;
}
.take-area.flash { animation: kept 0.7s ease-out; }
@keyframes kept {
  0% { box-shadow: 0 0 0 2px var(--keep); }
  100% { box-shadow: 0 0 0 12px transparent; }
}
/* keep: a copy of the take's piano roll flies to the shelf (or song slot) */
.take-fly {
  position: fixed;
  z-index: 60;
  pointer-events: none;
  border-radius: var(--radius-sm);
  border: 2px solid var(--role, var(--keep));
  background: var(--screen);
  box-shadow: var(--shadow);
  overflow: hidden;
  transform-origin: center;
  will-change: transform, opacity;
}
.take-fly img { display: block; width: 100%; height: 100%; object-fit: fill; }
.just-kept { animation: landed 0.9s ease-out; }
@keyframes landed {
  0% { box-shadow: 0 0 0 2px var(--keep), 0 0 0 0 color-mix(in srgb, var(--keep) 50%, transparent); }
  100% { box-shadow: 0 0 0 2px transparent, 0 0 0 12px transparent; }
}
.slate { display: grid; gap: 4px; min-width: 0; }
.slate-line { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: var(--fs-xs); color: var(--faint); }
.take-no {
  font-family: var(--font-mono);
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--role);
}
.slate-sep { width: 1px; height: 12px; background: var(--line); }
.take-name {
  margin: 0;
  font-family: var(--font-display);
  font-stretch: 116%;
  font-weight: 750;
  font-size: var(--fs-take);
  line-height: 1.05;
  letter-spacing: -0.01em;
  text-wrap: balance;
  overflow-wrap: anywhere;
}
.take-meta { margin: 0; color: var(--muted); font-size: var(--fs-sm); }
.take-heard {
  display: flex; align-items: baseline; gap: 6px;
  margin: 2px 0 0; color: var(--muted); font-size: var(--fs-sm); line-height: 1.35;
}
.take-heard .ico { flex: none; position: relative; top: 2px; }
.screen {
  position: relative;
  height: 210px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--line);
  background: var(--screen);
  overflow: hidden;
}
.screen[draggable="true"] { cursor: grab; }
.roll-base, .roll-head { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

.takes { display: flex; align-items: center; gap: 6px; min-width: 0; }
.take-dots { display: flex; gap: 4px; flex-wrap: wrap; flex: 1; min-width: 0; }
.take-dot {
  width: 14px;
  height: 14px;
  padding: 0;
  border-radius: 3px;
  border: 1px solid var(--line);
  background: transparent;
}
.take-dot.is-kept { background: var(--keep); border-color: var(--keep); }
.take-dot.is-current { border-color: var(--role); box-shadow: 0 0 0 2px color-mix(in srgb, var(--role) 45%, transparent); }
.takes-count { font-size: var(--fs-xs); color: var(--faint); }

.pads { display: grid; grid-template-columns: 1fr 1fr 1fr 1.25fr; gap: 8px; }
.pad {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  height: 58px;
  border-radius: var(--radius);
  border: 1px solid var(--line);
  background: var(--raised);
  font-weight: 600;
  font-size: var(--fs-md);
  transition: transform 0.06s;
}
.pad:active:not(:disabled) { transform: translateY(1px); }
.pad kbd { position: absolute; top: 6px; right: 7px; font-size: 0.58rem; }
.pad .ico { width: 22px; height: 22px; }
.pad-reject .ico { color: var(--tally); }
.pad-reject:hover:not(:disabled) { border-color: color-mix(in srgb, var(--tally) 60%, var(--line)); }
.pad-vary:hover:not(:disabled), .pad-play:hover:not(:disabled) { border-color: var(--faint); }
.pad-play.is-playing { border-color: var(--tally); color: var(--tally); }
.pad-keep { background: var(--keep); border-color: var(--keep); color: var(--on-keep); }
.pad-keep kbd { color: inherit; border-color: color-mix(in srgb, var(--on-keep) 35%, transparent); }
.pad-keep:hover:not(:disabled) { filter: brightness(1.06); }

.booth-row { display: flex; align-items: center; gap: 8px 14px; flex-wrap: wrap; }
.place-group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0; }
.place-target { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-sm); color: var(--muted); }
.place-target strong { color: var(--ink); font-weight: 600; }
.place-target select { height: 30px; }
.target-lane { color: var(--ink); }
.toggle { display: inline-flex; align-items: center; gap: 7px; font-size: var(--fs-sm); color: var(--muted); cursor: pointer; }
.toggle input { width: 16px; height: 16px; accent-color: var(--keep); margin: 0; }
.booth-row .toggle { margin-left: auto; }

.params {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 10px 16px;
  padding: 12px;
  border-radius: var(--radius-sm);
  border: 1px dashed var(--line);
  align-items: end;
}
.param { display: grid; gap: 3px; min-width: 0; }
.param-label { display: flex; justify-content: space-between; gap: 6px; font-size: var(--fs-xs); color: var(--muted); }
.param-label output { font-family: var(--font-mono); color: var(--faint); }
.param input[type="range"] { width: 100%; height: 22px; }
.param select { height: 30px; width: 100%; }
.params-reset { justify-self: start; }

/* ---------------- shelf ---------------- */
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 28px;
  padding: 0 10px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: transparent;
  color: var(--muted);
  font-size: var(--fs-sm);
}
.chip-n { font-family: var(--font-mono); font-size: 0.68rem; color: var(--faint); }
.chip.is-active { color: var(--ink); border-color: var(--ink); }
.shelf-tools { display: flex; gap: 6px; align-items: center; }
.shelf-tools input[type="search"] { flex: 1; }
.shelf-tools select { width: auto; }

.cards {
  list-style: none;
  margin: 0;
  padding: 2px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
  gap: 8px;
  overflow-y: auto;
  flex: 1;
  min-height: 120px;
  align-content: start;
}
.card {
  display: grid;
  gap: 6px;
  padding: 9px 10px 8px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--line);
  background: var(--raised);
  min-width: 0;
  cursor: grab;
}
.card:hover { border-color: color-mix(in srgb, var(--role) 50%, var(--line)); }
.card-top { display: flex; align-items: center; gap: 8px; min-width: 0; }
.card-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
.card-top .star { margin: -6px -6px -6px 0; }
.mini-roll { display: block; width: 100%; height: 40px; border-radius: 5px; }
.card-bottom { display: flex; align-items: center; gap: 6px; min-width: 0; }
.card-meta { font-size: var(--fs-xs); color: var(--faint); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card-actions { display: flex; align-items: center; gap: 2px; flex: none; }

/* parts / ideas switch */
.seg { display: inline-flex; padding: 2px; border: 1px solid var(--line); border-radius: 999px; gap: 2px; }
.seg-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 26px;
  padding: 0 11px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: var(--muted);
  font-size: var(--fs-sm);
}
.seg-btn.is-active { background: var(--raised); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }

/* ideas */
.cards.idea-cards { grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
.idea-card { cursor: default; grid-template-rows: auto auto 1fr auto; }
.idea-glyph { display: block; width: 100%; border-radius: 5px; }
.voices { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; }
.voice { display: grid; gap: 1px; min-width: 0; }
.voice-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
  padding: 0;
  border: 0;
  background: none;
  color: var(--ink);
  font-size: var(--fs-sm);
  text-align: left;
  cursor: pointer;
}
.voice-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.voice-btn:hover .voice-name { text-decoration: underline; text-underline-offset: 2px; }
.voice-desc { font-size: var(--fs-xs); color: var(--faint); line-height: 1.35; padding-left: 2px; }
.voice.is-off { opacity: 0.45; }
.voice.is-off .voice-name { text-decoration: line-through; }
.play-chip { gap: 4px; padding: 0 8px; }
.play-chip.is-playing { color: var(--tally); border-color: color-mix(in srgb, var(--tally) 55%, var(--line)); }
.idea-card .card-bottom { flex-wrap: wrap; row-gap: 4px; }
.idea-card .card-meta { flex-basis: 100%; }
.idea-card .card-actions { margin-left: auto; flex-wrap: wrap; justify-content: flex-end; }
.capture-list, .join-list { display: grid; gap: 6px; }

/* the ladder */
.ladder { display: grid; gap: 10px; }
.ladder-tools { display: flex; align-items: center; gap: 8px 14px; flex-wrap: wrap; }
.ladder-tools select { height: 32px; }
.ladder-voices { display: flex; gap: 6px; flex-wrap: wrap; }
.chip.is-off { opacity: 0.5; text-decoration: line-through; }
.rungs { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.rung-group {
  font-size: var(--fs-xs);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--faint);
  padding: 8px 2px 2px;
}
.rung { display: grid; gap: 4px; padding: 6px 8px 8px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--raised); }
.rung.is-current { border-color: var(--ink); }
.rung.is-live { border-color: var(--tally); box-shadow: inset 3px 0 0 var(--tally); }
.rung.is-disabled { opacity: 0.55; background: transparent; }
.rung-btn {
  display: grid;
  grid-template-columns: 22px 1fr auto 26px;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 0;
  border: 0;
  background: none;
  color: var(--ink);
  text-align: left;
  cursor: pointer;
}
.rung-btn:disabled { cursor: default; }
.rung-no { font-size: var(--fs-sm); color: var(--faint); text-align: center; }
.rung.is-current .rung-no { color: var(--ink); }
.rung-text { display: grid; gap: 1px; min-width: 0; }
.rung-text strong { font-size: var(--fs-md); }
.rung-text small { font-size: var(--fs-xs); color: var(--muted); line-height: 1.35; }
.rung-count { font-size: var(--fs-xs); color: var(--faint); white-space: nowrap; }
.rung-play { display: inline-flex; justify-content: center; color: var(--muted); }
.rung.is-live .rung-play { color: var(--tally); }
.rung-roll { display: block; width: 100%; border-radius: 5px; }
@media (max-width: 560px) {
  .rung-btn { grid-template-columns: 18px 1fr 22px; }
  .rung-count { display: none; }
}
.capture-row { color: var(--ink); }
.capture-row > span { display: inline-flex; align-items: center; gap: 6px; }

.empty {
  display: grid;
  place-content: center;
  text-align: center;
  gap: 4px;
  padding: 28px 16px;
  border: 1px dashed var(--line);
  border-radius: var(--radius-sm);
  color: var(--muted);
  flex: 1;
}
.empty p { margin: 0; max-width: 34ch; }
.empty-title { font-family: var(--font-display); font-stretch: 115%; font-weight: 700; color: var(--ink); font-size: var(--fs-lg); }

/* ---------------- song ---------------- */
.song-stats { color: var(--faint); font-size: var(--fs-sm); }
.arr-wrap { display: flex; gap: 8px; align-items: flex-start; min-width: 0; }
.arrangement {
  list-style: none;
  margin: 0;
  padding: 0 0 4px;
  display: flex;
  gap: 4px;
  overflow-x: auto;
  flex: 1;
  min-width: 0;
}
.arr-item {
  --sec: hsl(var(--sec-hue) 55% 58%);
  flex-basis: 0;
  min-width: 84px;
  display: grid;
  gap: 4px;
}
.arr-chip {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  height: 36px;
  padding: 0 10px;
  border-radius: 6px;
  border: 1px solid color-mix(in srgb, var(--sec) 45%, var(--line));
  background: color-mix(in srgb, var(--sec) 14%, var(--raised));
  overflow: hidden;
  text-align: left;
  min-width: 0;
}
.arr-name { font-weight: 600; font-size: var(--fs-sm); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; position: relative; }
.arr-bars { font-size: 0.66rem; color: var(--muted); position: relative; }
.arr-progress {
  position: absolute;
  inset: 0;
  background: color-mix(in srgb, var(--sec) 32%, transparent);
  transform: scaleX(0);
  transform-origin: left;
  pointer-events: none;
}
.arr-item.is-selected .arr-chip { border-color: var(--ink); }
/* energy: a fill rising from the bottom of each chip, so the strip reads as a curve */
.arr-energy {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: calc(var(--energy, 0.5) * 100%);
  background: color-mix(in srgb, var(--sec) 30%, transparent);
  pointer-events: none;
}
/* entry marks on the left edge: fill = one tick, build = a ramp, gap = a ramp with a break */
.arr-entry {
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 9px;
  pointer-events: none;
  background: var(--ink);
  opacity: 0.55;
}
.arr-entry-fill { width: 3px; }
.arr-entry-build { clip-path: polygon(0 100%, 100% 0, 100% 100%); }
.arr-entry-gap { clip-path: polygon(0 100%, 60% 25%, 60% 100%); border-right: 2px solid transparent; }
.arr-chip > .arr-name { margin-left: 2px; }
.arr-tools { display: flex; justify-content: center; gap: 0; }
.arr-add { flex: none; height: 36px; }

.sheet-wrap {
  overflow-x: auto;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--bg);
}
.sheet {
  display: grid;
  grid-template-columns: 200px repeat(var(--cols), minmax(158px, 1fr));
  min-width: min-content;
}
.corner, .sec-head, .lane-head, .cell { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.corner {
  position: sticky;
  left: 0;
  z-index: 3;
  background: var(--panel);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  padding: 8px 10px;
}
.sec-head {
  --sec: hsl(var(--sec-hue) 55% 58%);
  display: grid;
  gap: 4px;
  padding: 7px 8px;
  background: var(--panel);
  border-top: 3px solid color-mix(in srgb, var(--sec) 70%, transparent);
  min-width: 0;
}
.sec-head.is-selected { background: color-mix(in srgb, var(--sec) 10%, var(--panel)); }
.sec-head.is-live { border-top-color: var(--tally); }
.sec-line { display: flex; align-items: center; gap: 2px; min-width: 0; }
.sec-name {
  flex: 1;
  min-width: 0;
  text-align: left;
  border: 0;
  background: transparent;
  padding: 2px 2px;
  font-family: var(--font-display);
  font-stretch: 112%;
  font-weight: 700;
  font-size: var(--fs-md);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.sec-line-2 { gap: 6px; }
.nrg-btn {
  flex: none;
  height: 24px;
  padding: 0 4px;
  border: 1px solid transparent;
  border-radius: 5px;
  background: transparent;
  display: inline-flex;
  align-items: center;
}
.nrg-btn:hover { border-color: var(--line); }
.nrg { display: inline-flex; align-items: flex-end; gap: 2px; height: 14px; }
.nrg i { display: block; width: 3px; border-radius: 1px; background: var(--line); }
.nrg i:nth-child(1) { height: 30%; }
.nrg i:nth-child(2) { height: 47%; }
.nrg i:nth-child(3) { height: 64%; }
.nrg i:nth-child(4) { height: 82%; }
.nrg i:nth-child(5) { height: 100%; }
.nrg i.on { background: color-mix(in srgb, var(--sec) 80%, var(--ink)); }
.nrg-btn.is-auto i.on { background: color-mix(in srgb, var(--sec) 55%, var(--muted)); }
.nrg-btn.is-off .nrg { opacity: 0.35; }
.bars-fld { display: inline-flex; align-items: center; gap: 3px; font-size: var(--fs-xs); color: var(--faint); }
.bars-fld select { height: 24px; padding: 0 2px; font-size: var(--fs-xs); font-family: var(--font-mono); }
.chords-btn {
  flex: 1;
  min-width: 0;
  height: 24px;
  border: 1px solid transparent;
  border-radius: 5px;
  background: transparent;
  color: var(--muted);
  font-size: var(--fs-xs);
  text-align: left;
  padding: 0 4px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.chords-btn:hover { border-color: var(--line); color: var(--ink); }

.lane-head {
  position: sticky;
  left: 0;
  z-index: 2;
  background: var(--panel);
  display: grid;
  gap: 5px;
  padding: 7px 8px 7px 10px;
  align-content: center;
  box-shadow: inset 3px 0 0 color-mix(in srgb, var(--role) 70%, transparent);
}
.lane-line { display: flex; align-items: center; gap: 4px; min-width: 0; }
.led { position: relative; width: 9px; height: 9px; border-radius: 50%; background: var(--line); flex: none; margin-right: 2px; }
.led::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: var(--role);
  opacity: calc(0.25 + var(--lit, 0) * 0.75);
  box-shadow: 0 0 calc(var(--lit, 0) * 10px) var(--role);
}
.lane-name {
  flex: 1;
  min-width: 0;
  text-align: left;
  border: 0;
  background: transparent;
  padding: 2px;
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.ms {
  width: 24px;
  height: 22px;
  border-radius: 4px;
  border: 1px solid var(--line);
  background: transparent;
  font-family: var(--font-mono);
  font-size: 0.66rem;
  font-weight: 600;
  color: var(--faint);
  padding: 0;
  flex: none;
}
.ms.is-on { background: var(--r-lead); border-color: var(--r-lead); color: #1a1500; }
.ms-solo.is-on { background: var(--r-pad); border-color: var(--r-pad); color: #021428; }
.patch-sel { height: 26px; font-size: var(--fs-xs); flex: 1; min-width: 0; padding: 0 4px; }
.vol { width: 60px; flex: none; height: 20px; }

.cell {
  position: relative;
  display: grid;
  align-content: start;
  gap: 4px;
  min-height: 74px;
  padding: 7px 8px;
  background: var(--panel);
  cursor: pointer;
  min-width: 0;
  outline: none;
}
.cell:hover { background: color-mix(in srgb, var(--role) 5%, var(--panel)); }
.cell.is-filled { background: color-mix(in srgb, var(--role) 7%, var(--panel)); }
.cell.is-muted { opacity: 0.5; }
.cell.is-selected { box-shadow: inset 0 0 0 2px var(--role); z-index: 1; }
.cell:focus-visible { box-shadow: inset 0 0 0 2px var(--focus); }
.cell.is-drop { box-shadow: inset 0 0 0 2px var(--keep); background: color-mix(in srgb, var(--keep) 12%, var(--panel)); }
.cell-name { font-size: var(--fs-sm); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-right: 40px; }
.cell-oct { position: absolute; top: 6px; right: 6px; font-size: 0.6rem; padding: 0 5px; }
.cell .mini-roll { height: 32px; }
.cell-empty { display: grid; place-items: center; height: 58px; color: var(--faint); border: 1px dashed var(--line); border-radius: 5px; }
.cell-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 2px; }
.cell-tools-empty { gap: 4px; }
.tiny-toggle {
  height: 24px;
  padding: 0 7px;
  border-radius: 4px;
  border: 1px solid var(--line);
  background: transparent;
  font-size: 0.66rem;
  font-weight: 600;
  color: var(--faint);
}
.tiny-toggle.is-on { color: var(--ink); border-color: var(--role); }
.hint { margin: 0; font-size: var(--fs-xs); color: var(--faint); }

/* booth: edit notes, keep bars */
.take-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin-top: 8px; }
.take-tools .tiny-toggle { display: inline-flex; align-items: center; gap: 4px; }
.locks { display: inline-flex; align-items: center; gap: 3px; flex-wrap: wrap; }
.locks-label { font-size: 0.64rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint); font-weight: 600; margin-right: 3px; }
.lock-btn {
  min-width: 26px;
  height: 24px;
  padding: 0 5px;
  border-radius: 4px;
  border: 1px solid var(--line);
  background: transparent;
  font-family: var(--font-mono);
  font-size: 0.68rem;
  color: var(--faint);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 2px;
}
.lock-btn:hover { color: var(--ink); border-color: var(--muted); }
.lock-btn.is-on { color: var(--ink); border-color: var(--role); background: color-mix(in srgb, var(--role) 16%, transparent); }
.edit-hint { font-size: var(--fs-xs); color: var(--muted); }
.screen.is-editing { cursor: crosshair; box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--role) 60%, transparent); touch-action: none; }

/* section type, energy curve, the bars a part plays */
.sec-line-3 { gap: 6px; }
.type-btn {
  flex: 1;
  min-width: 0;
  height: 22px;
  padding: 0 6px;
  border: 1px dashed var(--line);
  border-radius: 5px;
  background: transparent;
  color: var(--faint);
  font-size: var(--fs-xs);
  text-align: left;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.type-btn:hover { color: var(--ink); border-color: color-mix(in srgb, var(--sec) 60%, var(--line)); }
.type-btn.is-set {
  border-style: solid;
  border-color: color-mix(in srgb, var(--sec) 45%, transparent);
  background: color-mix(in srgb, var(--sec) 12%, transparent);
  color: var(--ink);
  font-weight: 600;
}
.curve-tag { flex: none; display: inline-flex; align-items: center; color: color-mix(in srgb, var(--sec) 80%, var(--ink)); }
.curve-glyph { width: 22px; height: 13px; overflow: visible; }
.curve-glyph path { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
.span-bar { position: relative; display: block; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
.span-bar i { position: absolute; top: 0; bottom: 0; border-radius: 2px; background: var(--role); }
.span-note { font-size: 0.66rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--faint); }
.cell.is-out .mini-roll, .cell.is-out .cell-name { opacity: 0.4; }
.cell.is-out.is-filled { background: repeating-linear-gradient(135deg, transparent 0 6px, color-mix(in srgb, var(--role) 6%, transparent) 6px 12px), var(--panel); }
.theme-badge {
  display: inline-grid;
  place-items: center;
  width: 16px;
  height: 16px;
  margin-right: 5px;
  border-radius: 4px;
  background: var(--role);
  color: var(--panel);
  font-family: var(--font-mono);
  font-size: 0.62rem;
  font-weight: 700;
  vertical-align: 1px;
}
.form-tag { font-weight: 500; font-size: 0.68rem; color: var(--muted); }
.reuse-list { display: grid; gap: 8px; }
.reuse-row { grid-template-columns: 1fr 150px; align-items: center; }
.reuse-row small { color: var(--faint); }
.sec-story { margin: 0 0 8px; font-size: var(--fs-xs); color: var(--muted); line-height: 1.45; }
.sec-story strong { color: var(--ink); }

.type-group { border: 0; margin: 0 0 10px; padding: 0; display: grid; gap: 4px; }
.type-group legend { font-size: 0.64rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint); font-weight: 600; margin-bottom: 4px; }
.type-opt { display: flex; gap: 10px; align-items: flex-start; padding: 7px 9px; border: 1px solid var(--line); border-radius: 7px; cursor: pointer; }
.type-opt:hover { border-color: var(--muted); }
.type-opt:has(input:checked) { border-color: var(--ink); background: color-mix(in srgb, var(--ink) 5%, transparent); }
.type-opt input { margin-top: 3px; flex: none; }
.type-opt span { display: grid; gap: 2px; }
.type-opt small { color: var(--muted); font-size: var(--fs-xs); line-height: 1.4; }
.type-more { margin: 4px 0 10px; }
.type-more summary { cursor: pointer; font-size: var(--fs-sm); color: var(--muted); margin-bottom: 8px; }
.type-none { margin-top: 4px; }

/* ---------------- tabs (phones) ---------------- */
.tabs {
  display: none;
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 25;
  background: var(--panel);
  border-top: 1px solid var(--line);
  padding-top: 4px;
  padding-bottom: max(6px, env(safe-area-inset-bottom, 0px));
  padding-left: max(var(--gutter), env(safe-area-inset-left, 0px));
  padding-right: max(var(--gutter), env(safe-area-inset-right, 0px));
}
.tab {
  flex: 1;
  display: grid;
  justify-items: center;
  gap: 1px;
  padding: 6px 0 2px;
  border: 0;
  background: transparent;
  color: var(--faint);
  font-size: var(--fs-xs);
  font-weight: 600;
}
.tab.is-active { color: var(--ink); }
.tab-n { font-weight: 500; color: var(--faint); }

/* ---------------- toasts, menus, dialogs ---------------- */
#toasts {
  position: fixed;
  left: 50%;
  bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  z-index: 60;
  display: grid;
  gap: 8px;
  width: min(520px, calc(100vw - 32px));
  pointer-events: none;
}
.toast {
  pointer-events: auto;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 12px 10px 14px;
  border-radius: var(--radius-sm);
  background: var(--ink);
  color: var(--bg);
  box-shadow: var(--shadow);
  font-size: var(--fs-sm);
  animation: toast-in 0.18s ease-out;
}
.toast.out { opacity: 0; transform: translateY(6px); transition: 0.2s; }
.toast-warn { background: var(--tally); color: #fff; }
.toast-msg { flex: 1; min-width: 0; }
.toast-action { border: 0; background: transparent; color: inherit; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; padding: 4px; }
.toast-progress { flex-wrap: wrap; }
.toast-progress .bar { flex-basis: 100%; height: 4px; border-radius: 2px; background: color-mix(in srgb, var(--bg) 25%, transparent); overflow: hidden; }
.toast-progress .bar span { display: block; height: 100%; background: var(--keep); transform: scaleX(0); transform-origin: left; transition: transform 0.2s; }
@keyframes toast-in { from { opacity: 0; transform: translateY(8px); } }

.menu {
  position: fixed;
  z-index: 70;
  min-width: 220px;
  max-width: min(320px, calc(100vw - 16px));
  max-height: min(70vh, 520px);
  overflow-y: auto;
  padding: 5px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--line);
  background: var(--raised);
  box-shadow: var(--shadow);
}
.menu-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  width: 100%;
  min-height: 34px;
  padding: 6px 10px;
  border: 0;
  border-radius: 5px;
  background: transparent;
  text-align: left;
  font-size: var(--fs-md);
}
.menu-item:hover:not(:disabled), .menu-item:focus-visible { background: var(--panel); outline: none; }
.menu-item kbd { border: 0; padding: 0; font-size: var(--fs-xs); color: var(--faint); }
.menu-item.danger { color: var(--tally); }
.menu-item.checked span::before { content: "● "; color: var(--keep); }
.menu-sep { height: 1px; background: var(--line); margin: 5px 4px; }
.menu-heading { padding: 6px 10px 3px; font-size: 0.64rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint); font-weight: 600; }

#overlay { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; padding: 16px; }
.scrim { position: absolute; inset: 0; background: rgba(5, 6, 9, 0.6); }
.dialog {
  position: relative;
  width: min(460px, 100%);
  max-height: calc(100vh - 32px);
  overflow-y: auto;
  border-radius: var(--radius);
  border: 1px solid var(--line);
  background: var(--panel);
  box-shadow: var(--shadow);
  padding: 18px;
  display: grid;
  gap: 14px;
}
.dialog-wide { width: min(560px, 100%); }
.dialog:has(.ladder) { width: min(760px, 100%); }
.dialog:has(.fit) { width: min(840px, 100%); }
.dialog-title { margin: 0; font-family: var(--font-display); font-stretch: 115%; font-weight: 700; font-size: var(--fs-xl); text-wrap: balance; }
.dialog-body { display: grid; gap: 12px; }
.dialog-body p { margin: 0; }
.dialog-actions { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.field { display: grid; gap: 5px; font-size: var(--fs-sm); color: var(--muted); border: 0; margin: 0; padding: 0; min-width: 0; }
.field legend { padding: 0; margin-bottom: 4px; }
.field input, .field select { width: 100%; color: var(--ink); }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.radio { display: flex; align-items: center; gap: 8px; color: var(--ink); padding: 3px 0; }
.help { font-size: var(--fs-sm); color: var(--muted); }
.help-warn { color: var(--tally); }
.chord-preview { font-size: var(--fs-sm); color: var(--ink); min-height: 1.4em; }
.chord-preview small { color: var(--faint); font-size: 0.66rem; margin-left: 2px; vertical-align: super; }
.chord-preview .bad { color: var(--tally); }
.keys { border-collapse: collapse; width: 100%; font-size: var(--fs-sm); }
.keys td { padding: 5px 4px; border-bottom: 1px solid var(--line); }
.keys td:first-child { width: 120px; }

body.is-dragging .cell { transition: box-shadow 0.1s; }

/* ---------------- responsive ---------------- */
@media (max-width: 1100px) {
  .desk { grid-template-columns: minmax(0, 1fr); grid-template-areas: "song" "booth" "shelf"; }
  .shelf { height: auto; min-height: 0; max-height: 640px; }
}

@media (max-width: 480px) {
  .brand { display: none; }
}

@media (max-width: 760px) {
  :root { --gutter: 16px; }
  .topbar { padding-block: 6px; }
  .top-row { gap: 6px; }
  .wordmark { font-size: 0.95rem; }
  .session-btn { max-width: none; flex: 1; padding: 2px 8px; }
  .onair { display: none; }
  .transport { margin-left: 0; }
  .play-main { width: 40px; height: 40px; }
  .top-actions { gap: 2px; }
  .top-actions [data-act="help"], .top-actions [data-act="redo"], .top-actions [data-act="midi-setup"] { display: none; }
  .export-btn span { display: none; }
  .export-btn { width: 36px; padding: 0; justify-content: center; margin-left: 0; }
  .fields-toggle { display: inline-grid; }
  .fields { display: none; }
  .fields.open { display: grid; grid-template-columns: 1fr 1fr; }
  .fields .fld-range input { width: 100%; }
  .fields .fld select, .fields .fld input[type="number"] { width: 100%; }
  .meter { display: none; }
  .fields .phone-only { display: flex; gap: 6px; grid-column: 1 / -1; }
  .fields .more-btn { display: none; }
  .fields .fields-more { display: contents; }
  .arr-label { display: none; }

  .desk { display: block; padding-block: 12px calc(92px + env(safe-area-inset-bottom, 0px)); }
  .panel { border: 0; background: transparent; padding: 0; }
  .panel:not(.is-tab) { display: none; }
  .shelf { max-height: none; }
  .cards { overflow: visible; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
  .card-bottom { flex-wrap: wrap; }
  .card-meta { flex-basis: 100%; }
  .card-actions { margin-left: auto; }
  .tabs { display: flex; }
  #toasts { bottom: calc(76px + env(safe-area-inset-bottom, 0px)); }

  .booth-target { margin-left: 0; width: 100%; }
  .screen { height: 170px; }
  .pads { grid-template-columns: 1fr 1fr 1fr; }
  .pad { height: 54px; font-size: var(--fs-sm); gap: 6px; }
  .pad-keep { order: -1; grid-column: 1 / -1; }
  .pad kbd, .role-btn kbd, .booth-row kbd, .btn kbd { display: none; }
  .booth-row .toggle { margin-left: 0; }
  .params { grid-template-columns: 1fr 1fr; }
  .sheet { grid-template-columns: 136px repeat(var(--cols), minmax(140px, 1fr)); }
  .lane-head .vol { width: 44px; }
  .lane-head .ms { width: 22px; }
  .corner .btn span { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* who leads: each part's role in its section */
.link-btn {
  border: 0;
  background: none;
  padding: 0;
  font: inherit;
  font-weight: 600;
  color: var(--ink);
  text-decoration: underline;
  text-underline-offset: 2px;
  cursor: pointer;
}
.link-btn:hover { color: var(--focus); }
.sec-lead { color: var(--ink); }
.cell-head { display: flex; align-items: center; gap: 4px; min-width: 0; }
.cell-head .cell-name { flex: 1; min-width: 0; padding-right: 0; }
.cell-head .cell-oct { position: static; flex: none; }
.box-tag {
  display: inline-flex;
  align-items: center;
  flex: none;
  height: 18px;
  padding: 0 6px;
  border: 1px solid transparent;
  border-radius: 4px;
  font-size: 0.62rem;
  font-weight: 700;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  white-space: nowrap;
  line-height: 1;
}
.box-tag-sm { height: 15px; padding: 0 4px; font-size: 0.55rem; letter-spacing: 0.05em; }
/* filled: steers the others; strong ink: stands out */
.box-tag[data-box="hook"] { background: var(--ink); color: var(--panel); }
.box-tag[data-box="topline"] { border-color: var(--ink); color: var(--ink); }
.box-tag[data-box="groove"] { background: color-mix(in srgb, var(--muted) 32%, transparent); color: var(--ink); }
.box-tag[data-box="bed"] { border: 1px dashed color-mix(in srgb, var(--muted) 55%, transparent); color: var(--muted); }
.box-tag[data-box="none"] { color: var(--faint); border-color: var(--line); }

.fit { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
.fit-tools { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.fit-tools select { height: 32px; min-width: 140px; }
.fit-tools .btn { margin-left: auto; }
.fit-headline { font-size: var(--fs-md); font-weight: 600; line-height: 1.4; }
.fit-map-scroll { overflow-x: auto; }
.fit-map {
  display: grid;
  grid-template-columns: 16px minmax(480px, 1fr);
  grid-template-areas: "up plane" "down plane" ". x";
  gap: 4px 6px;
}
.fit-y {
  writing-mode: vertical-rl;
  transform: rotate(180deg);
  text-align: center;
  font-size: 0.64rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  font-weight: 600;
  color: var(--faint);
}
.fit-y-up { grid-area: up; }
.fit-y-down { grid-area: down; }
.fit-x {
  grid-area: x;
  display: flex;
  justify-content: space-between;
  font-size: 0.64rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  font-weight: 600;
  color: var(--faint);
}
.fit-plane {
  grid-area: plane;
  display: block;
  width: 100%;
  height: auto;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--screen);
}
.fit-q { fill: color-mix(in srgb, var(--ink) 3%, transparent); }
.fit-q-hook { fill: color-mix(in srgb, var(--ink) 6%, transparent); }
.fit-axis { stroke: var(--line); stroke-width: 1; }
.fit-quad-name { fill: var(--muted); font-family: var(--font-display); font-stretch: 115%; font-weight: 700; font-size: 15px; }
.fit-quad-blurb { fill: var(--faint); font-size: 10.5px; }
.fit-link { fill: none; stroke: var(--muted); stroke-linecap: round; opacity: 0.85; }
.fit-link.is-logged { stroke: var(--ink); opacity: 1; }
.fit-arr-head { fill: var(--muted); }
.fit-arr-head.is-logged { fill: var(--ink); }
.fit-node circle { fill: var(--role); stroke: var(--screen); stroke-width: 3; }
.fit-node text {
  fill: var(--ink);
  font-size: 13px;
  font-weight: 600;
  paint-order: stroke;
  stroke: var(--screen);
  stroke-width: 4px;
  stroke-linejoin: round;
}
.fit-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
.fit-links, .fit-parts { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 8px; }
.fit-links li { display: grid; grid-template-columns: 30px 1fr; gap: 8px; align-items: start; font-size: var(--fs-sm); }
.fit-links strong { display: block; font-weight: 600; }
.fit-links small, .fit-parts small { display: block; font-size: var(--fs-xs); color: var(--faint); line-height: 1.4; }
.fit-links .fit-none { grid-template-columns: 1fr; color: var(--muted); }
.fit-sample { width: 28px; height: 10px; margin-top: 5px; overflow: visible; }
.fit-sample .fit-link { stroke-width: 1.8; }
.fit-chords { display: inline-flex; justify-content: center; height: auto; margin-top: 1px; color: var(--muted); }
.fit-part { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; gap: 2px 8px; align-items: center; font-size: var(--fs-sm); }
.fit-part strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fit-part small { grid-column: 2 / -1; }
.fit-part.is-muted { opacity: 0.6; }
.ribbon-wrap { overflow-x: auto; margin-top: 8px; border: 1px solid var(--line); border-radius: var(--radius-sm); }
.ribbon { border-collapse: collapse; min-width: 100%; font-size: var(--fs-xs); }
.ribbon th, .ribbon td { padding: 5px 6px; text-align: center; white-space: nowrap; border-bottom: 1px solid var(--grid); }
.ribbon tr:last-child th, .ribbon tr:last-child td { border-bottom: 0; }
.ribbon tbody th { position: sticky; left: 0; z-index: 1; text-align: left; font-weight: 600; background: var(--panel); }
.ribbon tbody th .dot { display: inline-block; margin-right: 6px; }
.ribbon .is-current { background: color-mix(in srgb, var(--ink) 7%, var(--panel)); }
.ribbon-sec {
  border: 0;
  border-bottom: 2px solid hsl(var(--sec-hue) 55% 58%);
  background: none;
  padding: 2px 3px;
  font: inherit;
  font-weight: 600;
  color: var(--ink);
  cursor: pointer;
}
.ribbon-sec:hover { color: var(--focus); }
.ribbon-gap { color: var(--faint); }
@media (max-width: 640px) {
  .fit-cols { grid-template-columns: 1fr; }
}

/* melody first: a tune that sets its section's chords */
.chords-btn.is-led, .chord-line.is-led { color: var(--ink); }
.chords-btn.is-led .ico, .chord-line.is-led .ico { vertical-align: -2px; margin-right: 3px; }
.chords-btn.is-led { border-color: var(--line); border-style: dashed; }
.lead-mark { display: inline-flex; flex: none; color: var(--ink); }
.ribbon .lead-mark { vertical-align: -2px; margin-left: 3px; }
.tiny-toggle:disabled { opacity: 0.45; cursor: not-allowed; }
.fit-lead { display: inline-flex; align-items: center; gap: 4px; height: 22px; }
.fit-part:has(.fit-lead) { grid-template-columns: auto minmax(0, 1fr) auto auto auto; }
.fit-tune strong { font-weight: 700; }
.tune-opts { display: grid; gap: 6px; }
.tune-opts .type-opt small.mono { color: var(--ink); font-size: var(--fs-sm); }
.lead-note { display: flex; gap: 6px; align-items: flex-start; }
.lead-note .ico { flex: none; margin-top: 2px; }

/* ======================= Bones to Gold: the idea audition screen =======================
 * One screen at a time: body[data-screen] is "bones" (this) or "studio" (the sheet,
 * booth and shelf). Bobby Beatdown hosts; three cards per round; history below. */
:root {
  --b-gold: var(--r-lead);
  --b-on-gold: #1d1600;
  --b-bone: #b9b3a4;
  --b-bone2: #cfc091;
  --b-face-line: #ecebe6;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) { --b-on-gold: #ffffff; --b-bone: #7d7564; --b-bone2: #8a7428; --b-face-line: #1a1c22; }
}
:root[data-theme="light"] { --b-on-gold: #ffffff; --b-bone: #7d7564; --b-bone2: #8a7428; --b-face-line: #1a1c22; }

body[data-screen="bones"] #topbar,
body[data-screen="bones"] #desk,
body[data-screen="bones"] #tabs { display: none !important; }
body:not([data-screen="bones"]) #bones { display: none; }

.b2g { min-height: 100vh; display: flex; flex-direction: column; overflow-x: clip; }
.b2g button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.b-top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  padding: 10px max(20px, env(safe-area-inset-right, 0px)) 10px max(20px, env(safe-area-inset-left, 0px));
  border-bottom: 1px solid var(--line); background: var(--panel);
}
.b-brand { display: flex; align-items: baseline; gap: 10px; white-space: nowrap; }
.b-brand > span:last-child { color: var(--muted); font-size: 14px; }
.b-chips { display: flex; gap: 6px; flex: 1; justify-content: center; flex-wrap: wrap; align-items: center; min-width: 0; }
.b-chip { display: flex; align-items: center; gap: 7px; padding: 6px 12px 6px 9px; border-radius: 999px; font-size: 13px; color: var(--muted); border: 1px solid var(--line); }
.b-chip i { width: 9px; height: 9px; border-radius: 50%; display: block; }
.b-chip small { font-family: var(--font-mono); font-size: 10px; color: var(--faint); text-transform: uppercase; letter-spacing: 0.06em; }
.b-chip.todo { border-style: dashed; color: var(--faint); }
.b-chip.now { color: var(--ink); background: var(--raised); border-color: var(--b-gold); }
.b-chip.lead { color: var(--ink); }
.b-chip.pop { animation: b-fadeup 0.5s cubic-bezier(.2,.8,.2,1) backwards; }
.b-top-r { display: flex; align-items: center; gap: 12px; }
.b-meta { font-family: var(--font-mono); font-size: 12px; color: var(--faint); white-space: nowrap; }
.b-ghost { background: transparent; border: 1px solid var(--line); color: var(--ink); border-radius: 10px; padding: 0 16px; min-height: 44px; font-size: 14px; }
.b-ghost:hover { background: var(--raised); }
.b-ghost:disabled { opacity: 0.6; }
.b-primary { background: var(--b-gold); color: var(--b-on-gold); border: 0; border-radius: 10px; min-height: 44px; padding: 0 18px; font-size: 15px; font-weight: 700; display: inline-flex; align-items: center; gap: 8px; }
.b-primary:hover { filter: brightness(1.06); }
.b-stage { width: 100%; max-width: 1060px; margin: 0 auto; padding: 24px 16px 72px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; }

.b-bobby { display: flex; align-items: flex-end; gap: 16px; justify-content: center; min-height: 112px; width: 100%; }
.b-face { flex: none; }
.b-cloth { fill: var(--raised); stroke: var(--b-face-line); stroke-width: 2; }
.b-bubble { position: relative; background: var(--raised); border: 1px solid var(--line); border-radius: 18px; padding: 12px 18px 14px; max-width: 580px; font-size: 16px; line-height: 1.45; margin-bottom: 18px; }
.b-bubble::before { content: ''; position: absolute; left: -8px; bottom: 18px; width: 14px; height: 14px; background: var(--raised); border-left: 1px solid var(--line); border-bottom: 1px solid var(--line); transform: rotate(45deg); }
.b-who { display: block; font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--b-bone2); margin-bottom: 3px; }

.b-start { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 110px 0 140px; text-align: center; }
.b-go { background: var(--b-gold); color: var(--b-on-gold); border: 0; border-radius: 16px; padding: 22px 36px; font-family: var(--font-display); font-weight: 800; font-stretch: 115%; font-size: 24px; box-shadow: 0 0 60px color-mix(in srgb, var(--b-gold) 18%, transparent); }
.b-go:hover { filter: brightness(1.06); }
.b-start p { margin: 0; color: var(--muted); font-size: 15px; }

.b-callouts { display: grid; column-gap: 28px; align-items: end; min-height: 176px; margin-top: 4px; }
.b-reqs { display: flex; flex-direction: column; align-items: center; gap: 6px; margin-bottom: 24px; position: relative; animation: b-fadeup 0.3s ease-out backwards; }
.b-reqs::after { content: ''; position: absolute; left: 50%; bottom: -14px; width: 2px; height: 12px; margin-left: -1px; background: var(--line); }
.b-req { background: var(--raised); border: 1px solid var(--line); color: var(--ink); border-radius: 16px; min-height: 36px; padding: 0 16px; font-size: 14px; white-space: nowrap; }
.b-req:hover { border-color: var(--b-bone2); }
.b-req.on { border-color: var(--b-gold); color: var(--b-gold); }
.b-reqs-in { display: none; }

.b-cards { display: flex; gap: 28px; justify-content: center; align-items: flex-start; flex-wrap: wrap; padding-top: 4px; }
.b-card {
  position: relative; box-sizing: border-box; width: 300px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px 14px;
  transition: transform 0.28s cubic-bezier(.2,.8,.2,1), box-shadow 0.28s, border-color 0.28s;
  animation-duration: 0.5s; animation-timing-function: cubic-bezier(.2,.8,.2,1); animation-fill-mode: backwards;
}
.b-card:hover { border-color: color-mix(in srgb, var(--line) 60%, var(--ink)); }
.b-card.lifted { transform: translateY(-16px); border-color: var(--b-gold); box-shadow: 0 22px 44px rgba(0,0,0,.5), 0 0 0 1px color-mix(in srgb, var(--b-gold) 40%, transparent); }
.b-card.is-wait { border-style: dashed; border-color: color-mix(in srgb, var(--b-gold) 55%, transparent); }
.b-card.is-wait .b-vis { opacity: 0.35; transition: opacity 0.3s; }
.b-card .b-promote { display: none; }
.b-card.lifted .b-promote { display: flex; }
.b-hit { position: absolute; inset: 0; width: 100%; height: 100%; background: transparent; border: 0; border-radius: 14px; z-index: 1; padding: 0; }
.b-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; }
.b-letter { font-family: var(--font-display); font-weight: 800; font-size: 15px; color: var(--muted); }
.b-tag { font-weight: 600; font-size: 15px; }
.b-stat { margin-left: auto; font-family: var(--font-mono); font-size: 12px; color: var(--faint); white-space: nowrap; }
.b-vis { position: relative; width: 272px; height: 92px; background: var(--screen); border-radius: 8px; overflow: hidden; }
.b-vis i { position: absolute; display: block; }
.b-gl { top: 0; bottom: 0; width: 1px; background: var(--grid); }
.b-gl.bar { background: color-mix(in srgb, var(--ink) 15%, transparent); }
.b-blk { border-radius: 3px; }
.b-blk.acc { background: var(--b-bone); }
.b-blk.soft { background: color-mix(in srgb, var(--b-bone) 55%, transparent); }
.b-blk.ghost { background: color-mix(in srgb, var(--r-lead) 28%, transparent); }
.b-blk.half { opacity: 0.55; }
.b-blk.kick { filter: brightness(1.2); }
.b-dot { width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 50%; background: var(--b-bone2); }
.b-dot.land { width: 12px; height: 12px; margin: -6px 0 0 -6px; background: var(--b-gold); }
.b-ln { height: 2px; margin-top: -1px; background: var(--b-bone2); opacity: 0.75; transform-origin: 0 50%; }
.b-cell { height: 9px; border-radius: 2px; background: color-mix(in srgb, var(--ink) 8%, transparent); }
.b-cell.on { background: var(--b-bone2); }
.b-cell.root { background: var(--b-gold); }
.b-chd { position: absolute; height: 20px; border-radius: 4px; font-family: var(--font-mono); font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center; box-sizing: border-box; }
.b-chd.maj { background: color-mix(in srgb, var(--r-chords) 24%, transparent); color: var(--r-chords); }
.b-chd.min { background: color-mix(in srgb, var(--r-chords) 10%, transparent); color: var(--r-chords); }
.b-chd.col { background: color-mix(in srgb, var(--b-gold) 16%, transparent); color: var(--b-gold); border: 1px solid color-mix(in srgb, var(--b-gold) 50%, transparent); }
.b-nlab { position: absolute; font-family: var(--font-mono); font-size: 10px; color: var(--ink); }
.b-vis .b-ph { display: none; top: 0; bottom: 0; width: 2px; background: var(--b-gold); box-shadow: 0 0 8px var(--b-gold); }
.is-playing .b-ph { display: block; }
.b-promote { position: relative; z-index: 2; margin-top: 12px; width: 100%; justify-content: center; }

.b-actions { display: flex; gap: 14px; justify-content: center; align-items: center; margin-top: 30px; flex-wrap: wrap; text-align: center; }
.b-hint { color: var(--faint); font-size: 13px; }

.b-dirs { display: grid; grid-template-columns: repeat(3, minmax(0, 300px)); gap: 16px; justify-content: center; width: 100%; margin-top: 20px; }
