<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oddition</title>
<meta name="color-scheme" content="dark light">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@50..150,100..900&family=Instrument+Sans:wght@400..700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Oddition
 * Layout: a recording console. A transport strip on top; the audition booth and
 * the shelf side by side; the song sheet (lanes x sections) underneath. Phones get
 * one panel at a time with tabs at the bottom.
 * Dark first, with a light theme. One colour per stem, used everywhere. */

:root {
  --bg: #13151a;
  --panel: #1a1d23;
  --raised: #23272f;
  --screen: #0e1014;
  --line: #2f3440;
  --grid: rgba(236, 235, 230, 0.06);
  --roll-black: rgba(0, 0, 0, 0.22);
  --ink: #ecebe6;
  --muted: #9a9ead;
  --faint: #8d92a2;
  --tally: #ff5b4e;
  --keep: #4fcb84;
  --focus: #8db6ff;
  --on-keep: #08200f;
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.45);

  --r-drums: #f27b62;
  --r-perc: #a9d15a;
  --r-bass: #a395ff;
  --r-chords: #4ec8b2;
  --r-pad: #6fb0ff;
  --r-lead: #f1cd58;
  --r-arp: #ef84c7;

  --font-display: 'Anybody', 'Arial Narrow', 'Helvetica Neue', system-ui, sans-serif;
  --font-body: 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;

  --fs-xs: 0.72rem;
  --fs-sm: 0.8rem;
  --fs-md: 0.9rem;
  --fs-lg: 1.05rem;
  --fs-xl: 1.35rem;
  --fs-take: clamp(1.6rem, 1.1rem + 1.8vw, 2.35rem);

  --radius: 10px;
  --radius-sm: 7px;
  --gutter: 16px;
  color-scheme: dark;
}

@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #e9ebef;
    --panel: #f7f8fa;
    --raised: #ffffff;
    --screen: #eef0f4;
    --line: #d0d4dc;
    --grid: rgba(26, 28, 34, 0.06);
    --roll-black: rgba(26, 28, 34, 0.05);
    --ink: #1a1c22;
    --muted: #596070;
    --faint: #6a7080;
    --tally: #d93a2e;
    --keep: #1c9655;
    --focus: #2f66d6;
    --on-keep: #ffffff;
    --shadow: 0 10px 30px rgba(20, 24, 34, 0.16);
    --r-drums: #cf5135;
    --r-perc: #5f8a1a;
    --r-bass: #6a55e0;
    --r-chords: #0f8d78;
    --r-pad: #2b78cf;
    --r-lead: #a77f00;
    --r-arp: #c2448f;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #e9ebef;
  --panel: #f7f8fa;
  --raised: #ffffff;
  --screen: #eef0f4;
  --line: #d0d4dc;
  --grid: rgba(26, 28, 34, 0.06);
  --roll-black: rgba(26, 28, 34, 0.05);
  --ink: #1a1c22;
  --muted: #596070;
  --faint: #6a7080;
  --tally: #d93a2e;
  --keep: #1c9655;
  --focus: #2f66d6;
  --on-keep: #ffffff;
  --shadow: 0 10px 30px rgba(20, 24, 34, 0.16);
  --r-drums: #cf5135;
  --r-perc: #5f8a1a;
  --r-bass: #6a55e0;
  --r-chords: #0f8d78;
  --r-pad: #2b78cf;
  --r-lead: #a77f00;
  --r-arp: #c2448f;
  color-scheme: light;
}

[data-role="drums"] { --role: var(--r-drums); }
[data-role="perc"] { --role: var(--r-perc); }
[data-role="bass"] { --role: var(--r-bass); }
[data-role="chords"] { --role: var(--r-chords); }
[data-role="pad"] { --role: var(--r-pad); }
[data-role="lead"] { --role: var(--r-lead); }
[data-role="arp"] { --role: var(--r-arp); }

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.45;
  min-height: 100vh;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  background: var(--panel);
  z-index: 30;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; opacity: 0.4; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; letter-spacing: 0; }
kbd {
  font-family: var(--font-mono);
  font-size: 0.68rem;
  padding: 1px 5px;
  border: 1px solid var(--line);
  border-bottom-width: 2px;
  border-radius: 4px;
  color: var(--muted);
  background: transparent;
  line-height: 1.3;
}

.ico { width: 20px; height: 20px; flex: none; }
.ico-sm { width: 16px; height: 16px; }
.ico-xs { width: 13px; height: 13px; }
.ico-title { width: 18px; height: 18px; color: var(--muted); }

/* ---------------- buttons ---------------- */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 34px;
  padding: 0 12px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--line);
  background: var(--raised);
  white-space: nowrap;
}
.btn:hover:not(:disabled) { border-color: var(--faint); }
.btn-sm { height: 30px; padding: 0 10px; font-size: var(--fs-sm); }
.btn-xs { height: 26px; padding: 0 8px; font-size: var(--fs-xs); gap: 4px; }
.btn-ghost { background: transparent; }
.btn-primary { background: var(--ink); color: var(--bg); border-color: var(--ink); font-weight: 600; }
.btn-primary:hover:not(:disabled) { border-color: var(--ink); opacity: 0.9; }
.btn-danger { background: var(--tally); border-color: var(--tally); color: #fff; }
.btn.is-on { background: color-mix(in srgb, var(--focus) 18%, var(--raised)); border-color: color-mix(in srgb, var(--focus) 55%, var(--line)); }
.btn kbd { margin-left: 2px; }

.icon-btn {
  display: inline-grid;
  place-items: center;
  width: 36px;
  height: 36px;
  border-radius: var(--radius-sm);
  border: 1px solid transparent;
  background: transparent;
  color: var(--muted);
  flex: none;
}
.icon-btn:hover:not(:disabled) { color: var(--ink); background: var(--raised); border-color: var(--line); }
.icon-btn.is-on { color: var(--ink); }
.icon-btn-sm { width: 30px; height: 30px; }
.icon-btn-sm .ico { width: 17px; height: 17px; }
.icon-btn-xs { width: 26px; height: 26px; }
.icon-btn-xs .ico { width: 15px; height: 15px; }
.star.is-on { color: var(--r-lead); }

.when-playing { display: none !important; }
.is-playing .when-playing { display: inline-flex !important; }
.is-playing .when-stopped { display: none !important; }
.icon-btn.is-playing { color: var(--tally); }

select, input[type="text"], input[type="search"], input[type="number"] {
  height: 34px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--line);
  background: var(--raised);
  padding: 0 10px;
  min-width: 0;
}
select { padding-right: 6px; }
input[type="range"] { accent-color: var(--ink); min-width: 0; }

.eyebrow {
  font-size: 0.64rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--faint);
  font-weight: 600;
}
.pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: var(--fs-xs);
  padding: 1px 8px;
  border-radius: 999px;
  border: 1px solid var(--line);
  color: var(--muted);
  white-space: nowrap;
}
.pill-keep { color: var(--keep); border-color: color-mix(in srgb, var(--keep) 45%, var(--line)); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--role); flex: none; }
.tag {
  font-family: var(--font-mono);
  font-size: 0.62rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  padding: 2px 6px;
  border-radius: 4px;
  color: var(--role);
  background: color-mix(in srgb, var(--role) 15%, transparent);
  flex: none;
}

/* ---------------- top bar ---------------- */
.topbar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 20;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
  padding-block: 8px;
  padding-left: max(var(--gutter), env(safe-area-inset-left, 0px));
  padding-right: max(var(--gutter), env(safe-area-inset-right, 0px));
}
.top-row { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand { flex: none; }
.wordmark {
  font-family: var(--font-display);
  font-stretch: 150%;
  font-weight: 800;
  font-size: 1.15rem;
  letter-spacing: 0.02em;
  text-transform: uppercase;
}
.session-btn {
  display: grid;
  grid-template-columns: auto auto;
  grid-template-rows: auto auto;
  column-gap: 6px;
  align-items: center;
  text-align: left;
  padding: 3px 10px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--line);
  background: transparent;
  min-width: 0;
  max-width: 260px;
}
.session-btn .eyebrow { grid-column: 1 / -1; line-height: 1.2; }
.session-btn .session-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.session-btn .ico { color: var(--muted); }
.session-btn:hover { border-color: var(--faint); }

.transport { display: flex; align-items: center; gap: 10px; margin-left: auto; min-width: 0; }
.play-main {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: var(--raised);
  display: grid;
  place-items: center;
  flex: none;
}
.play-main .ico { width: 20px; height: 20px; }
.play-main.is-playing { background: var(--tally); border-color: var(--tally); color: #fff; }
.onair {
  display: flex;
  align-items: center;
  gap: 8px;
  height: 30px;
  padding: 0 12px;
  border-radius: 6px;
  border: 1px solid var(--line);
  background: var(--screen);
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--faint);
  min-width: 0;
  max-width: 260px;
}
.onair-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lamp { width: 8px; height: 8px; border-radius: 50%; background: var(--line); flex: none; }
.onair.is-live { color: var(--ink); }
.onair.is-live .lamp { background: var(--tally); box-shadow: 0 0 10px var(--tally); animation: lamp 1.6s ease-in-out infinite; }
@keyframes lamp { 50% { opacity: 0.55; } }

.top-actions { display: flex; align-items: center; gap: 4px; flex: none; }
.export-btn { margin-left: 6px; }
.fields-toggle { display: none; }

.fields {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: 10px 14px;
  padding-top: 8px;
}
.fld { display: grid; gap: 2px; font-size: var(--fs-sm); }
.fld > span { font-size: 0.64rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint); font-weight: 600; display: flex; gap: 6px; }
.fld output { color: var(--muted); font-family: var(--font-mono); letter-spacing: 0; text-transform: none; }
.fld select, .fld input[type="number"] { height: 30px; }
.fld-num input { width: 76px; font-family: var(--font-mono); }
.fld-range input { width: 120px; height: 30px; }
.meter { width: 120px; height: 8px; border-radius: 2px; margin-left: auto; align-self: center; }
.more-btn { align-self: flex-end; height: 30px; }
.fields-more { display: none; flex-basis: 100%; flex-wrap: wrap; align-items: flex-end; gap: 10px 14px; padding-top: 4px; border-top: 1px dashed var(--line); }
.fields-more.open { display: flex; }
.arr-label { flex: none; align-self: center; margin-right: 4px; }
.chord-mode .mono { font-size: var(--fs-xs); }
.phone-only { display: none; }

/* ---------------- desk ---------------- */
.desk {
  display: grid;
  grid-template-columns: minmax(0, 1.3fr) minmax(320px, 1fr);
  grid-template-areas: "song song" "booth shelf";
  gap: 14px;
  padding-block: 14px 40px;
  padding-left: max(var(--gutter), env(safe-area-inset-left, 0px));
  padding-right: max(var(--gutter), env(safe-area-inset-right, 0px));
  max-width: 1680px;
  margin: 0 auto;
}
.panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.booth { grid-area: booth; }
.shelf { grid-area: shelf; height: 0; min-height: 100%; }
.song { grid-area: song; }
.panel-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-width: 0; }
.panel-title {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0;
  font-family: var(--font-display);
  font-stretch: 112%;
  font-weight: 700;
  font-size: var(--fs-lg);
  letter-spacing: 0.01em;
}
.panel-title .count { font-size: var(--fs-sm); color: var(--faint); font-weight: 500; }
.panel-tools { display: flex; gap: 6px; margin-left: auto; flex-wrap: wrap; }

/* ---------------- booth ---------------- */
.booth-target { display: flex; align-items: center; gap: 10px; margin-left: auto; min-width: 0; flex-wrap: wrap; }
.inline-fld { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-sm); color: var(--muted); }
.inline-fld select { height: 30px; }
.chord-line { font-size: var(--fs-sm); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }

.roles { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.roles::-webkit-scrollbar { display: none; }
.role-btn {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  height: 34px;
  padding: 0 12px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: transparent;
  color: var(--muted);
  white-space: nowrap;
  flex: none;
}
.role-btn kbd { font-size: 0.6rem; padding: 0 4px; opacity: 0.8; }
.role-btn:hover { color: var(--ink); border-color: var(--faint); }
.role-btn.is-active {
  color: var(--ink);
  border-color: var(--role);
  background: color-mix(in srgb, var(--role) 16%, transparent);
}

.take-area {
  display: grid;
  gap: 10px;
  border-radius: var(--radius);
  transition: box-shadow 0.25s;
}
.take-area.flash { animation: kept 0.7s ease-out; }
@keyframes kept {
  0% { box-shadow: 0 0 0 2px var(--keep); }
  100% { box-shadow: 0 0 0 12px transparent; }
}
/* keep: a copy of the take's piano roll flies to the shelf (or song slot) */
.take-fly {
  position: fixed;
  z-index: 60;
  pointer-events: none;
  border-radius: var(--radius-sm);
  border: 2px solid var(--role, var(--keep));
  background: var(--screen);
  box-shadow: var(--shadow);
  overflow: hidden;
  transform-origin: center;
  will-change: transform, opacity;
}
.take-fly img { display: block; width: 100%; height: 100%; object-fit: fill; }
.just-kept { animation: landed 0.9s ease-out; }
@keyframes landed {
  0% { box-shadow: 0 0 0 2px var(--keep), 0 0 0 0 color-mix(in srgb, var(--keep) 50%, transparent); }
  100% { box-shadow: 0 0 0 2px transparent, 0 0 0 12px transparent; }
}
.slate { display: grid; gap: 4px; min-width: 0; }
.slate-line { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: var(--fs-xs); color: var(--faint); }
.take-no {
  font-family: var(--font-mono);
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--role);
}
.slate-sep { width: 1px; height: 12px; background: var(--line); }
.take-name {
  margin: 0;
  font-family: var(--font-display);
  font-stretch: 116%;
  font-weight: 750;
  font-size: var(--fs-take);
  line-height: 1.05;
  letter-spacing: -0.01em;
  text-wrap: balance;
  overflow-wrap: anywhere;
}
.take-meta { margin: 0; color: var(--muted); font-size: var(--fs-sm); }
.take-heard {
  display: flex; align-items: baseline; gap: 6px;
  margin: 2px 0 0; color: var(--muted); font-size: var(--fs-sm); line-height: 1.35;
}
.take-heard .ico { flex: none; position: relative; top: 2px; }
.screen {
  position: relative;
  height: 210px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--line);
  background: var(--screen);
  overflow: hidden;
}
.screen[draggable="true"] { cursor: grab; }
.roll-base, .roll-head { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

.takes { display: flex; align-items: center; gap: 6px; min-width: 0; }
.take-dots { display: flex; gap: 4px; flex-wrap: wrap; flex: 1; min-width: 0; }
.take-dot {
  width: 14px;
  height: 14px;
  padding: 0;
  border-radius: 3px;
  border: 1px solid var(--line);
  background: transparent;
}
.take-dot.is-kept { background: var(--keep); border-color: var(--keep); }
.take-dot.is-current { border-color: var(--role); box-shadow: 0 0 0 2px color-mix(in srgb, var(--role) 45%, transparent); }
.takes-count { font-size: var(--fs-xs); color: var(--faint); }

.pads { display: grid; grid-template-columns: 1fr 1fr 1fr 1.25fr; gap: 8px; }
.pad {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  height: 58px;
  border-radius: var(--radius);
  border: 1px solid var(--line);
  background: var(--raised);
  font-weight: 600;
  font-size: var(--fs-md);
  transition: transform 0.06s;
}
.pad:active:not(:disabled) { transform: translateY(1px); }
.pad kbd { position: absolute; top: 6px; right: 7px; font-size: 0.58rem; }
.pad .ico { width: 22px; height: 22px; }
.pad-reject .ico { color: var(--tally); }
.pad-reject:hover:not(:disabled) { border-color: color-mix(in srgb, var(--tally) 60%, var(--line)); }
.pad-vary:hover:not(:disabled), .pad-play:hover:not(:disabled) { border-color: var(--faint); }
.pad-play.is-playing { border-color: var(--tally); color: var(--tally); }
.pad-keep { background: var(--keep); border-color: var(--keep); color: var(--on-keep); }
.pad-keep kbd { color: inherit; border-color: color-mix(in srgb, var(--on-keep) 35%, transparent); }
.pad-keep:hover:not(:disabled) { filter: brightness(1.06); }

.booth-row { display: flex; align-items: center; gap: 8px 14px; flex-wrap: wrap; }
.place-group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0; }
.place-target { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-sm); color: var(--muted); }
.place-target strong { color: var(--ink); font-weight: 600; }
.place-target select { height: 30px; }
.target-lane { color: var(--ink); }
.toggle { display: inline-flex; align-items: center; gap: 7px; font-size: var(--fs-sm); color: var(--muted); cursor: pointer; }
.toggle input { width: 16px; height: 16px; accent-color: var(--keep); margin: 0; }
.booth-row .toggle { margin-left: auto; }

.params {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 10px 16px;
  padding: 12px;
  border-radius: var(--radius-sm);
  border: 1px dashed var(--line);
  align-items: end;
}
.param { display: grid; gap: 3px; min-width: 0; }
.param-label { display: flex; justify-content: space-between; gap: 6px; font-size: var(--fs-xs); color: var(--muted); }
.param-label output { font-family: var(--font-mono); color: var(--faint); }
.param input[type="range"] { width: 100%; height: 22px; }
.param select { height: 30px; width: 100%; }
.params-reset { justify-self: start; }

/* ---------------- shelf ---------------- */
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 28px;
  padding: 0 10px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: transparent;
  color: var(--muted);
  font-size: var(--fs-sm);
}
.chip-n { font-family: var(--font-mono); font-size: 0.68rem; color: var(--faint); }
.chip.is-active { color: var(--ink); border-color: var(--ink); }
.shelf-tools { display: flex; gap: 6px; align-items: center; }
.shelf-tools input[type="search"] { flex: 1; }
.shelf-tools select { width: auto; }

.cards {
  list-style: none;
  margin: 0;
  padding: 2px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
  gap: 8px;
  overflow-y: auto;
  flex: 1;
  min-height: 120px;

  'use strict';

  let pending = null;

      return typeof localStorage !== 'undefined' ? localStorage : null;
    } catch (e) {
      return null;
    }
  }

    if (!ls) return null;
    try {
      const raw = ls.getItem(KEY);
      if (!raw) return null;
      return Odd.model.migrate(JSON.parse(raw));
    } catch (e) {
      lastError = e;
      return null;
    }
  }

  /** returns { ok, bytes, error } */
  function save(ws) {
    const ls = storage();
    if (!ls) return { ok: false, error: new Error('Browser storage is not available.') };
    try {
      const text = JSON.stringify(ws);
      ls.setItem(KEY, text);
      lastError = null;
      return { ok: true, bytes: text.length };
    } catch (e) {
      lastError = e;
      return { ok: false, error: e };
    }

    pending = ws;

      const res = save(pending);
      pending = null;
      if (onDone) onDone(res);
    }, delay == null ? 500 : delay);
  }

  function flush() {
    if (!pending) return null;
    clearTimeout(timer);
    const res = save(pending);
    pending = null;
    return res;
  }

  function clear() {
    const ls = storage();
    if (ls) try { ls.removeItem(KEY); } catch (e) { /* ignore */ }
  }

  const past = [];
  const future = [];

  const history = {
    /** call before changing the workspace */
    record(ws, label) {
      past.push({ label: label || '', json: JSON.stringify(ws) });
      if (past.length > LIMIT) past.shift();
      future.length = 0;

    undo(ws) {
      const prev = past.pop();
      if (!prev) return null;
      future.push({ label: prev.label, json: JSON.stringify(ws) });
      return { ws: JSON.parse(prev.json), label: prev.label };
    },
    redo(ws) {
      const next = future.pop();
      if (!next) return null;
      past.push({ label: next.label, json: JSON.stringify(ws) });
      return { ws: JSON.parse(next.json), label: next.label };

    get canUndo() { return past.length > 0; },
    get canRedo() { return future.length > 0; },
    get undoLabel() { return past.length ? past[past.length - 1].label : ''; },
    get redoLabel() { return future.length ? future[future.length - 1].label : ''; },
    clear() { past.length = 0; future.length = 0; },
  };

    const fadeIn = Math.floor(sr * 0.004);
    const fadeOut = Math.floor(sr * 0.06);
    for (let ch = 0; ch < chans; ch++) {
      const d = b.getChannelData(ch);
      const r = lcg(777 + ch * 31); // different noise per side keeps the tail wide
      let lp = 0;
      for (let i = 0; i < len; i++) {
        const t = Math.min(1, i / shapeLen);
        const env = Math.exp(-6.4 * t) * (1 - t) * (i < fadeIn ? i / fadeIn : 1) * Math.min(1, (len - i) / fadeOut);
        const alpha = 0.82 - 0.68 * t; // darker as it decays
        lp += alpha * (r() - lp);
        d[i] = lp * env;
      }
      const taps = [0.009, 0.015, 0.023, 0.031, 0.043, 0.057];
      taps.forEach((tt, j) => {
        const idx = Math.floor((tt + ch * 0.0037) * sr);
        if (idx < len) d[idx] += (j % 2 ? -1 : 1) * (0.42 - j * 0.05);
      });
    }
    return b;
  }

  function pulseWave(env, duty) {
    const key = 'pulse' + duty;
    if (env.waves[key]) return env.waves[key];
    const n = 48;
    const re = new Float32Array(n);
    const im = new Float32Array(n);
    for (let i = 1; i < n; i++) re[i] = (2 / (i * Math.PI)) * Math.sin(i * Math.PI * duty);
    env.waves[key] = env.ctx.createPeriodicWave(re, im);
    return env.waves[key];
  }

  // drawbars 8', 4', 2 2/3', 2', 1 1/3' as [ratio, weight]; the 16' sub is its own oscillator
  const ORGAN_PARTIALS = [[1, 1], [2, 0.55], [3, 0.3], [4, 0.22], [6, 0.1]];
  const ORGAN_TOP = 12000; // partials above this are left out, as on a real drawbar organ's top end

  /**
   * One wave per pitch band, holding only the partials below ORGAN_TOP.
   * Browsers scale a PeriodicWave to peak 1 (and some ignore
   * disableNormalization), so the true peak of the weighted sum is measured
   * here and applied as gain: the level is then the same in every browser.
   * Returns { wave, peak }.
   */
  function organWave(env, f) {
    const n = Math.max(1, ORGAN_PARTIALS.filter(([r]) => f * r <= ORGAN_TOP).length);
    const key = 'organ' + n;
    if (env.waves[key]) return env.waves[key];
    const used = ORGAN_PARTIALS.slice(0, n);
    const size = used[used.length - 1][0] + 1;
    const re = new Float32Array(size);
    const im = new Float32Array(size);
    for (const [r, wt] of used) im[r] = wt;
    let peak = 0;
    for (let i = 0; i < 4096; i++) {
      const th = (i / 4096) * 2 * Math.PI;
      let x = 0;
      for (const [r, wt] of used) x += wt * Math.sin(r * th);
      peak = Math.max(peak, Math.abs(x));
    }
    env.waves[key] = { wave: env.ctx.createPeriodicWave(re, im), peak };
    return env.waves[key];
  }

  /**
   * fx: { reverb, delay } (default both on). Offline renders leave out effects
   * no patch sends to: the echo's feedback loop and the convolver keep
   * processing long after the last note, which dominates render time.
   */
  function buildEnv(ctx, offline, fx, light) {
    fx = fx || {};
    const env = {
      ctx, offline: !!offline, light: !!light, buses: new Map(), inputs: new WeakMap(), voices: [],
      chokes: new WeakMap(), noise: null, waves: {}, rand: lcg(99),
    };
    const master = ctx.createGain();
    master.gain.value = masterGainFor(offline ? DEFAULT_VOLUME : masterVolume);
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -14;
    comp.knee.value = 16;
    comp.ratio.value = 2.2;
    comp.attack.value = 0.012;
    comp.release.value = 0.22;
    const pre = ctx.createGain();
    pre.gain.value = 0.5;
    const clip = ctx.createWaveShaper();
    clip.curve = curve('softclip', (x) => 0.98 * Math.tanh(2 * x));
    clip.oversample = light ? 'none' : '2x';
    const analyser = ctx.createAnalyser();
    analyser.fftSize = 1024;
    analyser.smoothingTimeConstant = 0.6;
    master.connect(comp);
    comp.connect(pre);
    pre.connect(clip);
    clip.connect(analyser);
    analyser.connect(ctx.destination);

    // shared stereo reverb: each side is convolved with its own impulse, so
    // panned tracks keep their reverb level and side, and the tail stays
    // mono-compatible (no delayed copy of one side). The impulse is cut at
    // 1.7 s, where its 2.2 s decay is already below -56 dB. Light mode uses
    // one mono convolution (half the work), heard equally on both sides.
    const revIn = ctx.createGain();
    if (light) {
      revIn.channelCount = 1;
      revIn.channelCountMode = 'explicit';
    }
    if (fx.reverb !== false) {
      const revHp = ctx.createBiquadFilter();
      revHp.type = 'highpass';
      revHp.frequency.value = 200;
      const preDelay = ctx.createDelay(0.2);
      preDelay.delayTime.value = 0.02;
      const conv = ctx.createConvolver();
      conv.buffer = impulse(ctx, 1.7, 2.2, light ? 1 : 2);
      const revOut = ctx.createGain();
      revOut.gain.value = 0.7;
      revIn.connect(revHp);
      revHp.connect(preDelay);
      preDelay.connect(conv);
      conv.connect(revOut);
      revOut.connect(master);
    }

    // tempo-free stereo echo
    const delIn = ctx.createGain();
    if (fx.delay !== false) {
      const delOut = ctx.createGain();
      delOut.gain.value = 0.5;
      [[0.27, -0.55], [0.39, 0.55]].forEach(([time, panv]) => {
        const d = ctx.createDelay(1.5);
        d.delayTime.value = time;
        const lp = ctx.createBiquadFilter();
        lp.type = 'lowpass';
        lp.frequency.value = 2600;
        const fb = ctx.createGain();
        fb.gain.value = 0.34;
        delIn.connect(d);
        d.connect(lp);
        lp.connect(fb);
        fb.connect(d);
        if (ctx.createStereoPanner) {
          const p = ctx.createStereoPanner();
          p.pan.value = panv;
          lp.connect(p);
          p.connect(delOut);
        } else {
          lp.connect(delOut);
        }
      });
      delOut.connect(master);
    }

    Object.assign(env, { master, comp, analyser, revIn, delIn });
    envs.set(ctx, env);
    return env;
  }

  function envFor(ctx) { return envs.get(ctx) || buildEnv(ctx, isOfflineCtx(ctx)); }

  function realtimeCtx() {
    if (realtime) return realtime;
    const C = W && (W.AudioContext || W.webkitAudioContext);
    if (!C) throw new Error('Web Audio is not available in this browser.');
    // light mode asks for bigger output buffers: more headroom for the audio
    // thread on slow devices, at the cost of a little more latency
    const light = quality === 'light';
    try { realtime = new C({ latencyHint: light ? 'playback' : 'interactive' }); } catch (e) { realtime = new C(); }
    const env = buildEnv(realtime, false, null, light);
    Odd.audio.ctx = realtime;
    Odd.audio.analyser = env.analyser;
    return realtime;
  }

  function setParam(ctx, param, value) {
    if (isOfflineCtx(ctx) || ctx.currentTime === 0) {
      param.cancelScheduledValues(0);
      param.setValueAtTime(value, 0);
    } else {
      param.cancelScheduledValues(ctx.currentTime);
      param.setTargetAtTime(value, ctx.currentTime, 0.02);
    }
  }

  // ---------------------------------------------------------------- buses

  function makeBus(env, key) {
    const ctx = env.ctx;
    const input = ctx.createGain();
    const fader = ctx.createGain();
    const muteG = ctx.createGain();
    const pan = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
    const rev = ctx.createGain();
    const del = ctx.createGain();
    rev.gain.value = 0;
    del.gain.value = 0;
    input.connect(fader);
    fader.connect(muteG);
    let out = muteG;
    if (pan) { muteG.connect(pan); out = pan; }
    out.connect(env.master);
    out.connect(rev);
    rev.connect(env.revIn);
    out.connect(del);
    del.connect(env.delIn);
    const bus = {
      key, input, volume: 1, muted: false, patch: null,
      setVolume(v) {
        bus.volume = clamp(Number(v) || 0, 0, 1.5);
        setParam(ctx, fader.gain, bus.volume * bus.volume);
      },
      setMute(m) {
        bus.muted = !!m;
        setParam(ctx, muteG.gain, bus.muted ? 0 : 1);
      },
      setPan(x) { if (pan) setParam(ctx, pan.pan, clamp(Number(x) || 0, -1, 1)); },
      setSends(r, d) {
        setParam(ctx, rev.gain, r);
        setParam(ctx, del.gain, d);
      },
      dispose() {
        [input, fader, muteG, pan, rev, del].forEach((n) => { if (n) try { n.disconnect(); } catch (e) { /* gone */ } });
        env.buses.delete(key);
      },
    };
    env.inputs.set(input, bus);
    env.buses.set(key, bus);
    return bus;
  }

  function bus(key, ctxOrDest) {
    let ctx;
    if (ctxOrDest && typeof ctxOrDest.createGain === 'function') ctx = ctxOrDest;
    else if (ctxOrDest && ctxOrDest.context) ctx = ctxOrDest.context;
    else ctx = realtimeCtx();
    const env = envFor(ctx);
    const k = String(key);
    return env.buses.get(k) || makeBus(env, k);
  }

  // ---------------------------------------------------------------- voices

  function newVoice(env, dest, when) {
    const kill = env.ctx.createGain();
    kill.gain.value = 1;
    kill.connect(dest);
    const v = { env, start: when, end: when + 1, kill, sources: [], nodes: [kill], done: false };
    v.stop = function (t) { stopVoice(v, t); };
    return v;
  }

  function stopVoice(v, t) {
    if (v.done) return;
    const ctx = v.env.ctx;
    const at = Math.max(t == null ? ctx.currentTime : t, ctx.currentTime);
    if (at >= v.end) return;
    let e;
    if (at <= v.start) {
      e = v.start; // never sounds
    } else {
      v.kill.gain.cancelScheduledValues(at);
      v.kill.gain.setTargetAtTime(0, at, KILL_TC);
      e = at + KILL_TC * 7;
    }
    for (const s of v.sources) {
      try { s.stop(s._end != null ? Math.min(s._end, e) : e); } catch (err) { /* already stopped */ }
    }
    v.end = e;
  }

  function finishVoice(v, end) {
    v.end = end;
    let left = v.sources.length;
    const done = () => {
      if (--left > 0) return;
      v.done = true;
      for (const n of v.nodes) { try { n.disconnect(); } catch (e) { /* gone */ } }
    };
    for (const s of v.sources) {
      s.onended = done;
      s.stop(s._end != null ? Math.min(s._end, end) : end);
    }
    if (!left) v.done = true;
  }

  function register(env, v) {
    const pruneT = env.offline ? v.start : env.ctx.currentTime;
    env.voices = env.voices.filter((x) => !x.done && x.end > pruneT);
    const active = env.voices.filter((x) => x.start <= v.start && x.end > v.start);
    const cap = env.light ? VOICE_CAP_LIGHT : VOICE_CAP;
    while (active.length >= cap) active.shift().stop(v.start);
    env.voices.push(v);
  }

  /** node factory bound to one voice; everything it makes is cleaned up with the voice */
  function tools(env, v) {
    const ctx = env.ctx;
    const k = {
      /** light mode: builders leave out layers that cost more than they add on a phone */
      light: env.light,
      osc(type, f, when) {
        const o = ctx.createOscillator();
        o.type = type;
        o.frequency.setValueAtTime(nyq(f), when);
        o.start(when);
        v.sources.push(o);
        v.nodes.push(o);
        return o;
      },
      wave(pw, f, when) {
        const o = ctx.createOscillator();
        o.setPeriodicWave(pw);
        o.frequency.setValueAtTime(nyq(f), when);
        o.start(when);
        v.sources.push(o);
        v.nodes.push(o);
        return o;
      },
      noise(when, len) {
        const s = ctx.createBufferSource();
        s.buffer = noiseBuf(env);
        s.loop = true;
        s.start(when, (env.rand() + 1) * 0.7);
        if (len) s._end = when + len;
        v.sources.push(s);
        v.nodes.push(s);
        return s;
      },
      gain(val) {
        const g = ctx.createGain();
        g.gain.value = val;
        v.nodes.push(g);
        return g;
      },
      filter(type, f, q) {
        const b = ctx.createBiquadFilter();
        b.type = type;
        const res = q == null ? 0.7 : q;
        // Per-sample coefficient updates are the biggest per-voice cost, and on
        // gentle filters a cutoff that moves once per 128 samples is inaudible.
        // Resonant filters (Q >= 2) stay per-sample: stepping a swept cutoff
        // there makes zipper noise.
        if (res < 2 || env.light) {
          kRate(b.frequency);
          kRate(b.Q);
          kRate(b.gain);
        }
        b.frequency.value = nyq(f);
        b.Q.value = res;
        v.nodes.push(b);
        return b;
      },
      shaper(c) {
        const s = ctx.createWaveShaper();
        s.curve = c;
        v.nodes.push(s);
        return s;
      },
      /**
       * LFO into params; depth fades in after `delay` over `ramp` seconds.
       * Targets run at control rate, which is cheap and inaudible for vibrato
       * and slow filter sweeps. Pass `smooth` for amplitude (gain) targets:
       * stepping a gain every 128 samples buzzes.
       */
      lfo(rate, depth, targets, when, delay, ramp, smooth) {
        const o = k.osc('sine', rate, when);
        const g = k.gain(0);
        g.gain.setValueAtTime(0, when);
        g.gain.setValueAtTime(0, when + (delay || 0));
        g.gain.linearRampToValueAtTime(depth, when + (delay || 0) + (ramp || 0.01));
        o.connect(g);
        targets.forEach((t) => { if (!smooth) kRate(t); g.connect(t); });
        return o;
      },
    };
    return k;
  }

  // ---------------------------------------------------------------- pitched patches
  // builder(k, v, f, amp, vel, when, dur, pitch) -> end time

  const BUILD = {
    'bass-sub'(k, v, f, amp, vel, w, dur) {
      const vca = k.gain(0);
      const drv = k.shaper(driveCurve(1.6));
      const lp = k.filter('lowpass', Math.min(1200, 300 + f * 6), 0.4);
      k.osc('sine', f, w).connect(k.gain(0.62)).connect(drv);
      k.osc('triangle', f, w).connect(k.gain(0.14)).connect(drv);
      if (!k.light) k.osc('sine', f * 2, w).connect(k.gain(0.07)).connect(drv);
      drv.connect(lp).connect(vca).connect(v.kill);
      return adsr(vca.gain, w, dur, 0.6 * amp, 0.006, 0.4, 0.85, relT(0.09, dur));
    },
    'bass-saw'(k, v, f, amp, vel, w, dur) {
      const vca = k.gain(0);
      const lp = k.filter('lowpass', 300, 8);
      const mix = k.gain(k.light ? 0.52 : 0.3);
      mix.connect(lp);
      k.osc('sawtooth', f, w).connect(mix);
      if (!k.light) {
        const o2 = k.osc('sawtooth', f, w);
        o2.detune.value = 8;
        o2.connect(mix);
      }
      k.osc('square', f / 2, w).connect(k.gain(0.16)).connect(lp);
      sweep(lp.frequency, w, dur, nyq(160 + f * 1.5), nyq(450 + 3200 * vel), 0.004, 0.22, 0.15, 0.08);
      lp.connect(vca).connect(v.kill);
      return adsr(vca.gain, w, dur, 0.75 * amp, 0.004, 0.25, 0.75, relT(0.07, dur));
    },
    'bass-808'(k, v, f, amp, vel, w, dur) {
      const vca = k.gain(0);
      const o = k.osc('sine', f * 2.2, w);
      o.frequency.exponentialRampToValueAtTime(nyq(f), w + 0.06);
      const pre = k.gain(0.75);
      const sh = k.shaper(driveCurve(2.4));
      const lp = k.filter('lowpass', 1800 + 2000 * vel, 0.3);
      o.connect(vca).connect(pre).connect(sh).connect(lp).connect(v.kill);
      return adsr(vca.gain, w, dur, 0.9 * amp, 0.003, 2.0, 0, relT(0.12, dur));
    },
    'bass-pluck'(k, v, f, amp, vel, w, dur) {
      const vca = k.gain(0);
      const lp = k.filter('lowpass', 400, 2);
      k.osc('triangle', f, w).connect(k.gain(0.5)).connect(lp);
      k.osc('sawtooth', f, w).connect(k.gain(0.18)).connect(lp);
      sweep(lp.frequency, w, dur, nyq(220 + f), nyq(700 + 2600 * vel), 0.002, 0.15, 0.1, 0.06);
      lp.connect(vca).connect(v.kill);
      return adsr(vca.gain, w, dur, 0.95 * amp, 0.002, 0.45, 0.25, relT(0.08, dur));
    },
    epiano(k, v, f, amp, vel, w, dur, p) {
      const vca = k.gain(0);
      const car = k.osc('sine', f, w);
      const mod = k.osc('sine', f, w);
      const mg = k.gain(0);
      mod.connect(mg).connect(car.frequency);
      mg.gain.setValueAtTime(f * (1.1 + 2.4 * vel), w);
      mg.gain.setTargetAtTime(f * 0.18, w + 0.005, 0.35);
      const tine = k.osc('sine', f * 14, w);
      tine._end = w + 0.25; // its envelope is silent by then; don't run it for the whole note
      const tg = k.gain(0);
      tine.connect(tg).connect(car.frequency);
      tg.gain.setValueAtTime(f * 0.9 * vel, w);
      tg.gain.setTargetAtTime(0, w + 0.002, 0.025);
      car.connect(k.gain(k.light ? 0.82 : 0.75)).connect(vca);
      if (!k.light) {
        const body = k.osc('sine', f, w);
        body.detune.value = 5;
        body.connect(k.gain(0.3)).connect(vca);
      }
      vca.connect(v.kill);
      const pf = pitchFactor(p);
      return adsr(vca.gain, w, dur, 0.32 * amp, 0.002, 2.6 * pf, 0.15, relT(0.28, dur));
    },
    keys(k, v, f, amp, vel, w, dur, p) {
      const vca = k.gain(0);
      const lp = k.filter('lowpass', 1000, 0.5);
      k.osc('triangle', f, w).connect(k.gain(k.light ? 0.62 : 0.5)).connect(lp);
      if (!k.light) {
        const o2 = k.osc('triangle', f, w);
        o2.detune.value = 7;
        o2.connect(k.gain(0.22)).connect(lp);
        k.osc('sine', f * 3, w).connect(k.gain(0.05)).connect(lp);
      }
      k.osc('sine', f * 2, w).connect(k.gain(0.16)).connect(lp);
      const pf = pitchFactor(p);
      sweep(lp.frequency, w, dur, nyq(700 + f * 1.5), nyq(1800 + 6500 * vel), 0.002, 0.7 * pf, 0.25, 0.2);
      if (!k.light) {
        const hb = k.filter('bandpass', 2400, 1);
        const hg = k.gain(0);
        hit(hg.gain, w, 0.06 * vel, 0.001, 0.006);
        k.noise(w, 0.06).connect(hb).connect(hg).connect(vca);
      }
      lp.connect(vca);
      vca.connect(v.kill);
      return adsr(vca.gain, w, dur, 0.4 * amp, 0.002, 3.2 * pf, 0, relT(0.2, dur));
    },
    organ(k, v, f, amp, vel, w, dur) {
      const vca = k.gain(0);
      // drawbars in one wave (see organWave), plus the 16' sub
      const ow = organWave(v.env, f);
      const bars = k.wave(ow.wave, f, w);
      const sub = k.osc('sine', f * 0.5, w);
      bars.connect(k.gain(0.12 * ow.peak)).connect(vca);
      sub.connect(k.gain(0.42 * 0.12)).connect(vca);
      k.lfo(6.2, 9, [bars.detune, sub.detune], w, 0, 0.2);
      if (!k.light) {
        const hp = k.filter('highpass', 3000, 0.7);
        const cg = k.gain(0);
        hit(cg.gain, w, 0.05 * vel, 0.001, 0.004);
        k.noise(w, 0.04).connect(hp).connect(cg).connect(vca);
      }
      vca.connect(v.kill);
      return adsr(vca.gain, w, dur, amp, 0.008, 0.1, 1, relT(0.07, dur));
    },
    stab(k, v, f, amp, vel, w, dur) {
      const vca = k.gain(0);
      const lp = k.filter('lowpass', 800, 3);
      const mix = k.gain(k.light ? 0.28 : 0.2);
      mix.connect(lp);
      (k.light ? [-12, 12] : [-14, 0, 13]).forEach((dt) => {
        const o = k.osc('sawtooth', f, w);
        o.detune.value = dt;
        o.connect(mix);
      });
      k.osc('sawtooth', f * 2, w).connect(k.gain(0.08)).connect(lp);
      sweep(lp.frequency, w, dur, nyq(500 + f), nyq(2500 + 7000 * vel), 0.002, 0.16, 0.12, 0.08);
      lp.connect(vca).connect(v.kill);
      return adsr(vca.gain, w, dur, 0.75 * amp, 0.002, 0.24, 0.2, relT(0.1, dur));
    },
    'pad-warm'(k, v, f, amp, vel, w, dur) {
      const vca = k.gain(0);
      const lp = k.filter('lowpass', 600, 1.2);
      const mix = k.gain(k.light ? 0.245 : 0.2);
      mix.connect(lp);
      (k.light ? [-10, 10] : [-11, 0, 10]).forEach((dt) => {
        const o = k.osc('sawtooth', f, w);
        o.detune.value = dt;
        o.connect(mix);
      });
      k.osc('triangle', f / 2, w).connect(k.gain(0.16)).connect(lp);
      const cutoff = Math.min(3000, 450 + f * 0.9 + 900 * vel);
      const a = attT(0.6, dur);
      lp.frequency.setValueAtTime(cutoff * 0.5, w);
      lp.frequency.linearRampToValueAtTime(cutoff, w + a * 1.5);
      k.lfo(0.17, cutoff * 0.25, [lp.frequency], w, 0, 0.5);
      lp.connect(vca).connect(v.kill);
      return adsr(vca.gain, w, dur, 0.38 * amp, a, 1.2, 0.85, relT(1.4, dur));
    },
    'pad-glass'(k, v, f, amp, vel, w, dur) {
      const vca = k.gain(0);
      const hp = k.filter('highpass', 180, 0.5);
      const trem = k.gain(k.light ? 1.1 : 1);
      k.osc('sine', f, w).connect(k.gain(0.32)).connect(trem);
      const o2 = k.osc('triangle', f, w);
      o2.detune.value = 7;
      o2.connect(k.gain(0.22)).connect(trem);
      if (!k.light) {
        const o3 = k.osc('sine', f * 2, w);
        o3.detune.value = -6;
        o3.connect(k.gain(0.12)).connect(trem);
        k.osc('triangle', f * 3, w).connect(k.gain(0.04)).connect(trem);
      }
      k.lfo(4.2, 0.1, [trem.gain], w, 0.2, 0.6, true);
      trem.connect(hp).connect(vca).connect(v.kill);
      return adsr(vca.gain, w, dur, 0.34 * amp, attT(0.4, dur), 1.5, 0.8, relT(1.6, dur));
    },
    strings(k, v, f, amp, vel, w, dur) {
      const vca = k.gain(0);
      const lp = k.filter('lowpass', Math.min(9000, 1500 + 3000 * vel + f), 0.5);
      const hp = k.filter('highpass', 150, 0.5);
      const mix = k.gain(k.light ? 0.226 : 0.16);
      mix.connect(lp);
      const oscs = (k.light ? [-12, 11] : [-16, -5, 6, 15]).map((dt) => {
        const o = k.osc('sawtooth', f, w);
        o.detune.value = dt;
        o.connect(mix);
        return o;
      });
      k.lfo(5.3, 11, oscs.map((o) => o.detune), w, 0.3, 0.5);
      lp.connect(hp).connect(vca).connect(v.kill);
      return adsr(vca.gain, w, dur, 0.4 * amp, attT(0.3, dur), 0.6, 0.9, relT(0.6, dur));
    },
    'lead-square'(k, v, f, amp, vel, w, dur) {
      const vca = k.gain(0);
      const lp = k.filter('lowpass', Math.min(12000, 2000 + 4000 * vel + f * 2), 1);
      const o = k.wave(pulseWave(v.env, 0.3), f, w);
      const s = k.osc('square', f / 2, w);
      o.connect(k.gain(0.5)).connect(lp);
      s.connect(k.gain(0.08)).connect(lp);
      k.lfo(5.6, 16, [o.detune, s.detune], w, 0.22, 0.35);
      lp.connect(vca).connect(v.kill);
      return adsr(vca.gain, w, dur, 0.52 * amp, 0.006, 0.25, 0.75, relT(0.14, dur));
    },
    'lead-saw'(k, v, f, amp, vel, w, dur) {
      const vca = k.gain(0);
      const lp = k.filter('lowpass', 1400, 4);
      const o1 = k.osc('sawtooth', f, w);
      const o2 = k.osc('sawtooth', f, w);
      o1.detune.value = -6;
      o2.detune.value = 6;
      const mix = k.gain(0.26);
      mix.connect(lp);
      o1.connect(mix);
      o2.connect(mix);
      sweep(lp.frequency, w, dur, nyq(1000 + f), nyq(1800 + 5000 * vel + f * 2), 0.005, 0.3, 0.35, 0.12);
      k.lfo(5.5, 12, [o1.detune, o2.detune], w, 0.25, 0.35);
      lp.connect(vca).connect(v.kill);
      return adsr(vca.gain, w, dur, 0.62 * amp, 0.005, 0.3, 0.8, relT(0.14, dur));
    },
    'lead-soft'(k, v, f, amp, vel, w, dur) {
      const vca = k.gain(0);
      const o1 = k.osc('sine', f, w);
      const o2 = k.osc('triangle', f, w);
      o1.connect(k.gain(0.42)).connect(vca);
      o2.connect(k.gain(0.14)).connect(vca);
      const vib = [o1.detune, o2.detune];
      const r = relT(0.16, dur);
      if (!k.light) {
        const o3 = k.osc('sine', f * 2, w);
        o3.connect(k.gain(0.05)).connect(vca);
        vib.push(o3.detune);
        const hold = w + Math.max(dur, 0.03);
        const bp = k.filter('bandpass', Math.min(f * 2.2, 12000), 1.4);
        const bg = k.gain(0);
        bg.gain.setValueAtTime(0, w);
        bg.gain.linearRampToValueAtTime(0.16 * vel, w + 0.02);
        bg.gain.setTargetAtTime(0.035 * vel, w + 0.02, 0.08);
        bg.gain.setTargetAtTime(0, hold, r / 4);
        k.noise(w).connect(bp).connect(bg).connect(vca);
      }
      k.lfo(5, 10, vib, w, 0.3, 0.4);
      vca.connect(v.kill);
      return adsr(vca.gain, w, dur, 0.55 * amp, attT(0.045, dur), 0.2, 0.85, r);
    },
    bell(k, v, f, amp, vel, w, dur, p) {
      const vca = k.gain(0);
      const pf = pitchFactor(p);
      const car = k.osc('sine', f, w);
      const mod = k.osc('sine', f * 3.5, w);
      const mg = k.gain(0);
      mod.connect(mg).connect(car.frequency);
      mg.gain.setValueAtTime(f * (1.2 + 2.2 * vel), w);
      mg.gain.setTargetAtTime(f * 0.05, w + 0.002, 0.45 * pf);
      const car2 = k.osc('sine', f * 2.76, w);
      const g2 = k.gain(0);
      hit(g2.gain, w, 0.12, 0.002, 0.4 * pf);
      car.connect(k.gain(0.7)).connect(vca);
      car2.connect(g2).connect(vca);
      vca.connect(v.kill);
      return adsr(vca.gain, w, dur, 0.45 * amp, 0.002, 3.2 * pf, 0, Math.max(0.35, relT(0.9, dur)));
    },
    pluck(k, v, f, amp, vel, w, dur) {
      const vca = k.gain(0);
      const lp = k.filter('lowpass', 300, 5);
      k.osc('sawtooth', f, w).connect(k.gain(0.3)).connect(lp);
      const sq = k.osc('square', f, w);
      sq.detune.value = -6;
      sq.connect(k.gain(0.12)).connect(lp);
      sweep(lp.frequency, w, dur, nyq(200 + f * 0.6), nyq(900 + 6000 * vel + f * 2), 0.001, 0.14, 0, 0.1);
      if (!k.light) {
        const hp = k.filter('highpass', 4000, 0.7);
        const ng = k.gain(0);
        hit(ng.gain, w, 0.05 * vel, 0.0005, 0.004);
        k.noise(w, 0.03).connect(hp).connect(ng).connect(vca);
      }
      lp.connect(vca).connect(v.kill);
      return adsr(vca.gain, w, dur, 0.8 * amp, 0.001, 0.45, 0, relT(0.1, dur));
    },
  };

  // ---------------------------------------------------------------- drum kits

  const KITS = {
    'kit-acoustic': {
      kick: { f0: 125, f1: 52, pd: 0.075, dec: 0.12, click: 0.32, drive: 1.2, lvl: 1 },
      snare: { tone: 185, tone2: 0, tDec: 0.06, nDec: 0.075, hp: 1300, bp: 3200, tMix: 0.42, nMix: 0.9 },
      hat: { type: 'noise', hp: 7200, bp: 10500, tune: 1, cDec: 0.022, oDec: 0.13, lvl: 0.7 },
      tom: { dec: 0.17, tune: 1, tri: 0.3 }, cym: { dec: 0.6, tune: 1 }, clap: { bp: 1150, dec: 0.06 },
      hand: { tune: 1, dec: 1, skin: 1 },
      lp: 0, crush: 0,
    },
    'kit-808': {
      kick: { f0: 150, f1: 46, pd: 0.045, dec: 0.36, click: 0.06, drive: 1.4, lvl: 1 },
      snare: { tone: 238, tone2: 476, tDec: 0.045, nDec: 0.06, hp: 1900, bp: 0, tMix: 0.45, nMix: 0.6 },
      hat: { type: 'metal', hp: 7500, bp: 10000, tune: 1, cDec: 0.02, oDec: 0.12, lvl: 1.1 },
      tom: { dec: 0.28, tune: 0.92, tri: 0 }, cym: { dec: 0.55, tune: 1.05 }, clap: { bp: 1050, dec: 0.08 },
      hand: { tune: 1.06, dec: 1.2, skin: 0.4 },
      lp: 0, crush: 0,
    },
    'kit-909': {
      kick: { f0: 330, f1: 54, pd: 0.032, dec: 0.15, click: 0.55, drive: 2.2, lvl: 0.95 },
      snare: { tone: 200, tone2: 0, tDec: 0.05, nDec: 0.1, hp: 1100, bp: 0, tMix: 0.38, nMix: 0.7 },
      hat: { type: 'mix', hp: 8000, bp: 11000, tune: 1.12, cDec: 0.018, oDec: 0.1, lvl: 0.9 },
      tom: { dec: 0.19, tune: 1.05, tri: 0.15 }, cym: { dec: 0.5, tune: 1.15 }, clap: { bp: 1300, dec: 0.07 },
      hand: { tune: 1.04, dec: 0.9, skin: 0.7 },
      lp: 0, crush: 0,
    },
    'kit-lofi': {
      kick: { f0: 105, f1: 50, pd: 0.06, dec: 0.14, click: 0.12, drive: 1.3, lvl: 1 },
      snare: { tone: 175, tone2: 0, tDec: 0.06, nDec: 0.07, hp: 900, bp: 2200, tMix: 0.48, nMix: 0.85 },
      hat: { type: 'noise', hp: 6000, bp: 8000, tune: 1, cDec: 0.02, oDec: 0.1, lvl: 0.75 },
      tom: { dec: 0.15, tune: 0.95, tri: 0.25 }, cym: { dec: 0.45, tune: 0.9 }, clap: { bp: 1000, dec: 0.06 },
      hand: { tune: 0.96, dec: 0.9, skin: 0.8 },
      lp: 5500, crush: 1,
    },
    // hand percussion first: warm skins, a little room; the kit voices are the acoustic ones
    'kit-perc': {
      kick: { f0: 118, f1: 50, pd: 0.07, dec: 0.13, click: 0.25, drive: 1.1, lvl: 1 },
      snare: { tone: 190, tone2: 0, tDec: 0.06, nDec: 0.07, hp: 1400, bp: 3000, tMix: 0.45, nMix: 0.8 },
      hat: { type: 'noise', hp: 7400, bp: 10500, tune: 1, cDec: 0.02, oDec: 0.12, lvl: 0.65 },
      tom: { dec: 0.2, tune: 0.97, tri: 0.35 }, cym: { dec: 0.6, tune: 1 }, clap: { bp: 1100, dec: 0.06 },
      hand: { tune: 1, dec: 1.15, skin: 1.2 },
      lp: 0, crush: 0,
    },
  };

  const METAL = [2, 3, 4.16, 5.43, 6.79, 8.21];
  const METAL_LIGHT = [2, 4.16, 6.79];
  const TOMS = { 41: 82, 43: 97, 45: 110, 47: 130, 48: 147, 50: 174 };
  /*
   * Hand drums by GM note: [pitch Hz, body decay (s), kind]. Kinds:
   *   open  an open tone that rings; struck hard it gets a slap edge
   *   mute  a muted stroke: soft it is a heel/fingertip tap, hard it is a slap
   */
  const HAND = {
    60: [500, 0.07, 'open'], // high bongo (macho)
    61: [360, 0.09, 'open'], // low bongo (hembra)
    62: [330, 0.03, 'mute'], // muted / slapped high conga
    63: [320, 0.14, 'open'], // open high conga
    64: [225, 0.18, 'open'], // low conga (tumba)
  };

  function metal(k, base, w, dest, level) {
    const ratios = k.light ? METAL_LIGHT : METAL;
    const g = k.gain(level / Math.sqrt(6 * ratios.length)); // same loudness with fewer squares
    ratios.forEach((r) => k.osc('square', base * r, w).connect(g));
    g.connect(dest);
    return g;
  }

  /*
   * Every voice takes `vel` (0..1) as well as `amp`: a hard hit is not just
   * louder, it has more attack and more high end, and skins start higher
   * before they settle. A soft hit is duller and shorter.
   */

  function dKick(k, P, out, amp, w, tune, vel) {
    const f0 = P.f0 * tune * (0.86 + 0.26 * vel);
    const o = k.osc('sine', f0, w);
    o.frequency.exponentialRampToValueAtTime(P.f1 * tune, w + P.pd * (0.8 + 0.3 * vel));
    o.frequency.exponentialRampToValueAtTime(P.f1 * tune * 0.9, w + P.pd + P.dec * 4);
    const g = k.gain(0);
    g.gain.setValueAtTime(0, w);
    g.gain.linearRampToValueAtTime(amp * P.lvl * 0.9, w + 0.0025);
    g.gain.setTargetAtTime(0, w + 0.012, P.dec * (0.85 + 0.2 * vel));
    o.connect(g);
    if (P.drive) g.connect(k.shaper(driveCurve(Math.round(P.drive * (0.8 + 0.4 * vel) * 5) / 5))).connect(out);
    else g.connect(out);
    if (P.click) {
      const hp = k.filter('highpass', 2000 + 1500 * vel, 0.7);
      const cg = k.gain(0);
      hit(cg.gain, w, amp * P.click * (0.2 + 0.7 * vel), 0.0005, 0.004);
      k.noise(w, 0.04).connect(hp).connect(cg).connect(out);
    }
    return w + 0.012 + P.dec * 6.5;
  }

  function dSnare(k, P, out, amp, w, bright, alt, vel) {
    const tone = P.tone * (alt ? 1.08 : 1);
    const o = k.osc('triangle', tone * (1.1 + 0.3 * vel), w);
    o.frequency.exponentialRampToValueAtTime(tone, w + 0.025);
    const tg = k.gain(0);
    hit(tg.gain, w, amp * P.tMix, 0.002, P.tDec);
    o.connect(tg).connect(out);
    if (P.tone2) {
      const o2 = k.osc('sine', P.tone2, w);
      const g2 = k.gain(0);
      hit(g2.gain, w, amp * P.tMix * 0.5, 0.002, P.tDec * 0.8);
      o2.connect(g2).connect(out);
    }
    // soft strokes (ghost notes) are darker and shorter
    const hp = k.filter('highpass', P.hp * (alt ? 1.3 : 1) * (0.7 + 0.4 * vel), 0.7);
    let chain = k.noise(w).connect(hp);
    if (P.bp) {
      const body = k.filter('peaking', P.bp, 0.8);
      body.gain.value = 2 + 5 * vel;
      chain = chain.connect(body);
    }
    const ng = k.gain(0);
    const nDec = P.nDec * (alt ? 0.8 : 1) * (0.65 + 0.45 * vel);
    hit(ng.gain, w, amp * P.nMix * bright, 0.0015, nDec);
    chain.connect(ng).connect(out);
    return w + 0.004 + Math.max(P.tDec, nDec) * 7;
  }

  function dClap(k, P, out, amp, w, vel) {
    const hp = k.filter('highpass', 500, 0.5);
    const bp = k.filter('bandpass', P.bp * (0.85 + 0.3 * vel), 1.1);
    const g = k.gain(0);
    const pk = amp * 2.2;
    g.gain.setValueAtTime(0, w);
    let t = w;
    // a firm clap has tighter, sharper bursts
    const gap = 0.0105 - 0.002 * vel;
    for (let i = 0; i < 3; i++) {
      g.gain.linearRampToValueAtTime(pk, t + 0.0012);
      g.gain.linearRampToValueAtTime(pk * 0.12, t + gap - 0.001);
      t += gap;
    }
    g.gain.linearRampToValueAtTime(pk, t + 0.0012);
    g.gain.setTargetAtTime(0, t + 0.0015, P.dec * (0.75 + 0.4 * vel));
    k.noise(w).connect(hp).connect(bp).connect(g).connect(out);
    return t + P.dec * 7;
  }

  function dHat(k, P, out, amp, w, dec, bright, vel) {
    const g = k.gain(0);
    const end = hit(g.gain, w, amp * P.lvl * bright, 0.001, dec * (0.8 + 0.35 * vel));
    // a light tip touch is thin; a hard shoulder hit brings out the body
    const hp = k.filter('highpass', P.hp * (1.2 - 0.3 * vel), 0.6);
    hp.connect(g).connect(out);
    if (P.type !== 'metal') k.noise(w).connect(k.gain(P.type === 'mix' ? 0.55 : 1)).connect(hp);
    if (P.type !== 'noise') {
      // six detuned squares (808 style) with a presence lift near P.bp
      const lift = k.filter('peaking', P.bp, 0.9);
      lift.gain.value = 6;
      metal(k, 100 * P.tune, w, lift, P.type === 'mix' ? 0.5 : 2.2);
      lift.connect(hp);
    }
    return end;
  }

  function dTom(k, P, out, amp, w, note, vel) {
    const f = TOMS[note] * P.tune;
    const o = k.osc('sine', f * (1.25 + 0.6 * vel), w);
    o.frequency.exponentialRampToValueAtTime(f, w + 0.04 + 0.04 * vel);
    const g = k.gain(0);
    const end = hit(g.gain, w, amp * 0.8, 0.002, P.dec * (0.8 + 0.35 * vel));
    o.connect(g);
    if (P.tri && !k.light) {
      const t2 = k.osc('triangle', f * 2.4, w);
      t2.frequency.exponentialRampToValueAtTime(f * 1.5, w + 0.06);
      t2.connect(k.gain(P.tri * (0.5 + 0.7 * vel))).connect(g);
    }
    const bp = k.filter('bandpass', f * 6, 1);
    const ng = k.gain(0);
    hit(ng.gain, w, amp * (0.06 + 0.4 * vel), 0.001, 0.01);
    k.noise(w, 0.06).connect(bp).connect(ng).connect(out);
    g.connect(out);
    return end;
  }

  function dCrash(k, P, out, amp, w, note, vel) {
    const alt = note === 57;
    const dec = P.dec * (alt ? 1.25 : 1) * (0.7 + 0.5 * vel);
    const g = k.gain(0);
    const end = hit(g.gain, w, amp * 0.5, 0.003, dec);
    const hp = k.filter('highpass', 5500 - 2000 * vel, 0.5);
    k.noise(w).connect(k.gain(0.7)).connect(hp);
    const bp = k.filter('bandpass', 8000, 0.6);
    metal(k, 130 * P.tune * (alt ? 1.1 : 1), w, bp, 3);
    bp.connect(hp);
    hp.connect(g).connect(out);
    return end;
  }

  function dRide(k, P, out, amp, w, note, vel) {
    const alt = note === 59;
    const g = k.gain(0);
    const end = hit(g.gain, w, amp * 0.4, 0.002, alt ? 0.4 : 0.32);
    const bp = k.filter('bandpass', 4600 + 1200 * vel, 1.6);
    metal(k, 170 * P.tune * (alt ? 1.1 : 1), w, bp, 4);
    const hp = k.filter('highpass', 7000, 0.6);
    k.noise(w).connect(k.gain(0.15 + 0.3 * vel)).connect(hp).connect(g);
    bp.connect(g);
    g.connect(out);
    return end;
  }

  function dRideBell(k, P, out, amp, w) {
    const g = k.gain(0);
    const end = hit(g.gain, w, amp * 0.5, 0.001, 0.38);
    const bp = k.filter('bandpass', 2700, 2.5);
    metal(k, 105 * P.tune, w, bp, 3);
    bp.connect(g).connect(out);
    return end;
  }

  function dTamb(k, P, out, amp, w, vel) {
    const g = k.gain(0);
    const pk = amp * 0.9;
    // a shake is a smear of jingles; a hit on the head is one sharp burst
    const rattle = 0.06 + 0.04 * vel;
    g.gain.setValueAtTime(0, w);
    g.gain.linearRampToValueAtTime(pk, w + 0.001);
    g.gain.linearRampToValueAtTime(pk * (0.45 - 0.2 * vel), w + 0.012);
    g.gain.linearRampToValueAtTime(pk * 0.7, w + 0.018);
    g.gain.setTargetAtTime(0, w + 0.02, rattle);
    const hp = k.filter('highpass', 6500, 0.7);
    const bp = k.filter('bandpass', 8500 + 2000 * vel, 0.8);
    k.noise(w).connect(hp);
    metal(k, 240, w, hp, 1);
    hp.connect(bp).connect(g).connect(out);
    return w + 0.02 + rattle * 7;
  }

  function dCowbell(k, P, out, amp, w, vel) {
    const g = k.gain(0);
    const pk = amp * 0.5;
    g.gain.setValueAtTime(0, w);
    g.gain.linearRampToValueAtTime(pk, w + 0.001);
    g.gain.setTargetAtTime(pk * 0.3, w + 0.002, 0.012);
    g.gain.setTargetAtTime(0, w + 0.03, 0.06 + 0.05 * vel);
    const bp = k.filter('bandpass', 900, 1.3);
    k.osc('square', 540, w).connect(k.gain(0.5)).connect(bp);
    k.osc('square', 800, w).connect(k.gain(0.5)).connect(bp);
    bp.connect(g).connect(out);
    return w + 0.03 + 0.11 * 7;
  }

  function dShaker(k, P, out, amp, w, note, vel) {
    const g = k.gain(0);
    // a firm shake has a quicker, brighter front edge
    const att = 0.016 - 0.008 * vel;
    g.gain.setValueAtTime(0, w);
    g.gain.linearRampToValueAtTime(amp * 0.45, w + att);
    g.gain.setTargetAtTime(0, w + att + 0.002, 0.022 + 0.012 * vel);
    const hp = k.filter('highpass', (note === 70 ? 5500 : 4200) + 2000 * vel, 0.7);
    k.noise(w).connect(hp).connect(g).connect(out);
    return w + 0.02 + 0.034 * 7;
  }

  function dTone(k, out, type, f, amp, w, tc, drop) {
    const o = k.osc(type, f * (drop || 1), w);
    if (drop) o.frequency.exponentialRampToValueAtTime(f, w + 0.025);
    const g = k.gain(0);
    const end = hit(g.gain, w, amp, 0.001, tc);
    o.connect(g).connect(out);
    return end;
  }

  function dRim(k, P, out, amp, w, vel) {
    const hp = k.filter('highpass', 600, 0.7);
    const e1 = dTone(k, hp, 'triangle', 1550 + 300 * vel, amp * 0.5, w, 0.01);
    hp.connect(out);
    dTone(k, out, 'sine', 480, amp * 0.3, w, 0.012);
    const bp = k.filter('bandpass', 2400, 2);
    const ng = k.gain(0);
    hit(ng.gain, w, amp * (0.3 + 0.5 * vel), 0.0005, 0.006);
    k.noise(w, 0.04).connect(bp).connect(ng).connect(out);
    return Math.max(e1, w + 0.1);
  }

  /*
   * Congas and bongos: a skin (a sine that starts sharp and settles, plus an
   * inharmonic overtone) and a hand (a short noise burst). Velocity moves an
   * open stroke from a soft fingertip tone to a hard, ringing one with a slap
   * edge; a muted stroke from a quiet heel tap to a cracking slap.
   */
  function dHand(k, K, out, amp, w, note, vel) {
    const H = K.hand || { tune: 1, dec: 1, skin: 1 };
    const [f0, dec0, kind] = HAND[note];
    const f = f0 * H.tune;
    const mute = kind === 'mute';
    const slap = mute ? Math.max(0, (vel - 0.5) * 2) : Math.max(0, (vel - 0.75) * 2.5);
    let dec = dec0 * H.dec * (mute ? 0.6 + 0.6 * vel : 0.7 + 0.5 * vel);
    if (mute && slap > 0) dec *= 0.8;
    const body = mute ? 0.55 - 0.3 * slap : 0.85;
    const o = k.osc('sine', f * (1.04 + 0.14 * vel), w);
    o.frequency.exponentialRampToValueAtTime(f, w + 0.012 + 0.01 * vel);
    const g = k.gain(0);
    const end = hit(g.gain, w, amp * body, 0.0012, dec);
    o.connect(g).connect(out);
    if (!k.light) {
      // the skin's first overtone, a fifth-and-a-bit up, dies quickly
      const o2 = k.osc('sine', f * 1.59, w);
      const g2 = k.gain(0);
      hit(g2.gain, w, amp * body * (0.18 + 0.2 * vel), 0.001, dec * 0.35);
      o2.connect(g2).connect(out);
    }
    // the hand: dull thump when soft, bright crack when hard
    const bp = k.filter('bandpass', (mute ? 1400 : 1800) + 2600 * vel + 1200 * slap, mute ? 0.9 : 1.2);
    const ng = k.gain(0);
    hit(ng.gain, w, amp * H.skin * (0.08 + 0.35 * vel + 0.9 * slap), 0.0006, 0.006 + 0.012 * slap);
    k.noise(w, 0.06).connect(bp).connect(ng).connect(out);
    return Math.max(end, w + 0.08);
  }

  /** timbales: a bright, ringing shell over a tight head */
  function dTimbale(k, out, amp, w, note, vel) {
    const f = note === 65 ? 640 : 460;
    const g = k.gain(0);
